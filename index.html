function linkKey(p){return p.purchaseId?'purchase:'+p.purchaseId:p.payableId?'bill:'+p.payableId:p.openingId?'opening:'+p.openingId:''}
function paymentModal({bill,rec}){
  const open=payableItems().filter(p=>p.bal>0.004||(rec&&linkKey(rec)===`${p.kind}:${p.id}`));
  const lk=rec?linkKey(rec):bill?`${bill.kind}:${bill.id}`:'';
  const curr=k=>{const it=open.find(p=>`${p.kind}:${p.id}`===k);return it?{...it,bal:r2(it.bal+(rec&&linkKey(rec)===k?rec.amount:0))}:null};
  const b0=lk?curr(lk):null;
  const m=openModal({title:rec?'Edit supplier payment':'Pay a supplier',body:`<form id="pF" class="stack" style="gap:12px">
   ${rec&&!isAdmin()?'<div class="note warn">Your change will be sent to the admin for approval.</div>':''}
   <label class="f">Paying for<select class="in" name="link" id="pLink"><option value="">A general supplier payment (no bill)</option>${open.map(p=>`<option value="${p.kind}:${p.id}" ${lk===`${p.kind}:${p.id}`?'selected':''}>${esc(p.supplier)} — ${esc(p.desc.slice(0,60))} (owes ${money0(curr(`${p.kind}:${p.id}`).bal)})</option>`).join('')}</select></label>
   <div class="grid2"><label class="f">Branch${branchSelect('branchId',rec?rec.branchId:b0?b0.branchId:'')}</label><label class="f">Date${dateInput('date',rec&&rec.date)}</label></div>
   <div class="grid2"><label class="f">Paid to<input class="in" name="payee" required value="${esc(rec?rec.payee:b0?b0.supplier:'')}"></label><label class="f">Description<input class="in" name="description" value="${esc(rec?rec.description||'':b0?b0.desc.slice(0,80):'')}"></label></div>
   <div class="grid3"><label class="f">Amount (₦)<input class="in" name="amount" type="number" min="0.01" step="0.01" required inputmode="decimal" value="${rec?rec.amount:b0?b0.bal:''}"></label><label class="f">Method<select class="in" name="method">${PAY_METHODS.map(x=>`<option ${rec&&rec.method===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="f">Reference<input class="in" name="ref" placeholder="Teller / transfer ref" value="${esc(rec?rec.ref||'':'')}"></label></div>
   <div data-cashhint></div><div id="pErr" role="alert"></div><button class="btn primary" type="submit">${rec&&!isAdmin()?'Send for approval':'Save payment'}</button></form>`});
  const form=m.el.querySelector('#pF');
  wireCashHint(form,{out:true,prev:rec});
  form.link.addEventListener('change',()=>{const it=curr(form.link.value);if(it){form.payee.value=it.supplier;form.description.value=it.desc.slice(0,80);form.amount.value=it.bal;if(form.branchId.tagName==='SELECT')form.branchId.value=it.branchId}});
  form.addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(form));const er=errBox(m,'#pErr');
    const b=f.link?curr(f.link):null;const a=r2(f.amount);
    if(!f.branchId||!f.payee.trim()||!(a>0))return er('Branch, payee and amount are required.');
    if(b&&a>b.bal+0.004)return er(`That is more than the ${money(b.bal)} owed.`);
    const p={...(rec||{}),kind:'supplier',category:'Supplier payment',branchId:f.branchId,date:f.date,payee:f.payee.trim(),description:f.description,amount:a,method:f.method,ref:f.ref,purchaseId:b&&b.kind==='purchase'?b.id:'',payableId:b&&b.kind==='bill'?b.id:'',openingId:b&&b.kind==='opening'?b.id:'',by:rec?rec.by:S.user.id,createdAt:rec?rec.createdAt:Date.now()};
    try{await finishSave(m,await commit('payments',p,rec),rec?'Payment updated':'Payment recorded')}catch(err){}});
}

function expenseModal(rec,credit){
  const isBill=rec?!!rec.supplier&&rec.amount!=null&&!rec.payee:!!credit;
  const v=k=>rec?(rec[k]??''):'';
  const m=openModal({title:rec?(isBill?'Edit credit expense bill':'Edit expense'):'Record an expense',body:`<form id="xF" class="stack" style="gap:12px">
   ${rec&&!isAdmin()?'<div class="note warn">Your change will be sent to the admin for approval.</div>':''}

   <div class="grid2"><label class="f">Branch${branchSelect('branchId',v('branchId'))}</label><label class="f">Date${dateInput('date',v('date'))}</label></div>
   <div class="grid2"><label class="f">Category<select class="in" name="category">${EXP_CATS.map(c=>`<option ${v('category')===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="f">Paid to / supplier<input class="in" name="payee" required value="${esc(v('payee')||v('supplier'))}"></label></div>
   <label class="f">Description<input class="in" name="description" value="${esc(v('description'))}" placeholder="e.g. Haulage of 600 bags from Onitsha"></label>
   <div class="grid3"><label class="f">Amount (₦)<input class="in" name="amount" type="number" min="0.01" step="0.01" required inputmode="decimal" value="${v('amount')}"></label>
   <label class="f" data-paidonly>Method<select class="in" name="method">${PAY_METHODS.map(x=>`<option ${v('method')===x?'selected':''}>${x}</option>`).join('')}</select></label>
   <label class="f" data-creditonly>Due date<input class="in" type="date" name="due" value="${esc(v('due'))}"></label>
   <label class="f">Reference<input class="in" name="ref" value="${esc(v('ref'))}"></label></div>
   <div data-paidonly><div data-cashhint></div></div><div id="xErr" role="alert"></div><button class="btn primary" type="submit">${rec&&!isAdmin()?'Send for approval':'Save'}</button></form>`});
  const form=m.el.querySelector('#xF');
  const mode=()=>rec?(isBill?'credit':'paid'):form.querySelector('[name=mode]:checked').value;
  const sync=()=>{const c=mode()==='credit';$$('[data-paidonly]',m.el).forEach(x=>x.hidden=c);m.el.querySelector('[data-creditonly]').hidden=!c};sync();
  wireCashHint(form,{out:true,prev:rec&&!isBill?rec:null});
  $$('[name=mode]',form).forEach(r=>r.addEventListener('change',sync));
  form.addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(form));const er=errBox(m,'#xErr');const a=r2(f.amount);
    if(!f.branchId||!f.payee.trim()||!(a>0))return er('Branch, payee and amount are required.');
    try{
      if(mode()==='credit'){
        if(rec){const paid=sum(list('payments').filter(p=>p.payableId===rec.id),'amount');if(paid>a+0.004)return er(`${money(paid)} has already been paid on this bill.`)}
        const b={...(rec||{}),branchId:f.branchId,date:f.date,supplier:f.payee.trim(),category:f.category,description:f.description,amount:a,due:f.due,ref:f.ref,by:rec?rec.by:S.user.id,createdAt:rec?rec.createdAt:Date.now()};
        await finishSave(m,await commit('payables',b,rec),rec?'Bill updated':'Credit bill saved to Payables');
      }else{
        const p={...(rec||{}),kind:'expense',branchId:f.branchId,date:f.date,payee:f.payee.trim(),category:f.category,description:f.description,amount:a,method:f.method,ref:f.ref,by:rec?rec.by:S.user.id,createdAt:rec?rec.createdAt:Date.now()};
        await finishSave(m,await commit('payments',p,rec),rec?'Expense updated':'Expense recorded');
      }
    }catch(err){}});
}

async function saveCount(branchId,date,lines,adjust,note){
  const out=[];
  for(const l of lines){
    const line={productId:l.productId,qty:r2(l.qty),book:r2(l.book),method:l.photo?'camera':'manual',detail:l.photo?l.photo.detail:'',photoId:''};
    if(l.photo&&l.photo.dataUrl){const pid='ph_'+uid();try{await Store.putPhoto(pid,l.photo.dataUrl);line.photoId=pid}catch(e){toast('The photo could not be stored; the count was saved without it.',true)}}
    out.push(line);
  }
  const id=uid();
  await Store.put('counts',{id,branchId,date,lines:out,note:note||'',adjusted:!!adjust,by:S.user.id,createdAt:Date.now()});
  if(adjust)await applyCountAdjust(get('counts',id));
  await log('Closing count',`${bname(branchId)}: ${out.map(l=>`${pname(l.productId)} ${l.qty}`).join(', ')}`);
  return id;
}
async function applyCountAdjust(c){
  for(const x of list('moves').filter(x=>x.countId===c.id))await Store.del('moves',x.id);
  for(const l of c.lines||[]){const d=r2(l.qty-l.book);if(Math.abs(d)>0.0001)await Store.put('moves',{type:'adj',branchId:c.branchId,productId:l.productId,qty:d,date:c.date,note:'Adjusted to closing count',countId:c.id,by:S.user.id,createdAt:Date.now()})}
}

function wireCashHint(form,{out,amt='amount',prev}={}){
  const box=form.querySelector('[data-cashhint]');if(!box)return ()=>{};
  const upd=()=>{
    const b=form.branchId&&form.branchId.value,meth=form.method&&form.method.value;
    if(!b||meth!=='Cash'||(form.method&&form.method.closest('[hidden]'))){box.innerHTML='';return}
    const d=(form.date&&form.date.value)||today();
    let c=cashPos(b,d).cash;
    if(prev&&prev.branchId===b&&prev.method==='Cash'&&String(prev.date)<=d)c=r2(c+(out?(Number(prev.amount)||0):-(Number(prev.paid??prev.amount)||0)));
    const a=Number(form[amt]&&form[amt].value)||0;const short=out&&a>c+0.004;
    box.innerHTML=`<div class="cashbal ${short?'short':''}"><span aria-hidden="true">💵</span> Cash balance at ${esc(bname(b))} on ${fdate(d)}: <b>${money(c)}</b>${a?` · after this ${out?'payment':'receipt'}: <b>${money(out?c-a:c+a)}</b>`:''}${short?`<br>Not enough cash at this branch for this payment (short by ${money(a-c)}).`:''}</div>`;
  };
  form.addEventListener('input',upd);form.addEventListener('change',upd);upd();return upd;
}

  const LE=lineEditor(el,{allowCustom:true,bidFn:bid,priceKey:'price',lockPrice:priceLock,warnStock:pid=>rec&&bid()===rec.branchId?orig.get(pid):0,initial:rec&&rec.items,onCalc:(sub,warn)=>{
    const disc=Number(form.discount.value)||0;tot=r2(sub-disc);sync();
    const paid=Number(form.paid.value)||0,ps=form.pstatus.value;
    el.querySelector('#sSum').innerHTML=`<div class="r"><span>Subtotal</span><b>${money(sub)}</b></div><div class="r"><span>Discount</span><span>−${money(disc)}</span></div><div class="r big"><span>Total</span><span>${money(tot)}</span></div><div class="r"><span>Paid now</span><span>${money(paid)}</span></div><div class="r"><span>Balance (to receivables)</span><b class="${tot-paid>0.004?'neg':''}">${money(Math.max(0,tot-paid))}</b></div><div class="r"><span>Status</span>${statusPill(ps==='full'?'Paid':ps==='part'?'Partially paid':'Unpaid')}</div>${warn.length?`<div class="note warn">${warn.map(esc).join('<br>')}</div>`:''}`;
    hint();
  }});
  hint=wireCashHint(form,{out:false,amt:'paid',prev:rec});
  form.discount.addEventListener('input',LE.calc);
  form.paid.addEventListener('input',LE.calc);
  form.pstatus.addEventListener('change',()=>{if(form.pstatus.value==='part'){form.paid.value='';setTimeout(()=>form.paid.focus(),0)}LE.calc()});
  const bs=form.querySelector('#sBranch');if(bs)bs.addEventListener('change',()=>LE.reset());
  const owes=()=>{const box=form.querySelector('[data-owes]');const n=normName(form.customer.value);if(!n||isWalkIn(n)||!bid()){box.innerHTML='';return}
    const a=custAccounts().find(x=>x.key===bid()+'|'+n);const bal=a?r2(a.bal-(rec&&normName(rec.customer)===n?saleBal(rec,index()):0)):0;
    box.innerHTML=a&&bal>0.004?`<div class="note warn" style="margin-top:6px">${esc(a.name)} already owes <b>${money(bal)}</b>${a.items.some(i=>i.kind==='opening')?' (including the old balance from before the app)':''}. This sale is added to the same account. <button type="button" class="btn sm" data-act="accStmt" data-id="cust:${esc(a.key)}">See statement</button></div>`:''};
  form.customer.addEventListener('input',owes);form.customer.addEventListener('change',owes);owes();
  form.addEventListener('submit',e=>{e.preventDefault();save()});
  el.querySelector('#sSave').onclick=save;
  async function save(){
    const er=errBox(m,'#sErr');
    if(!bid())return er('Select the branch.');
    const LN=LE.lines();
    if(LN.some(x=>x.p==='__other'&&!x.n))return er('Type the name of the item that is not on the list.');
    const items=LN.filter(x=>x.p&&x.q>0&&(x.p!=='__other'||x.n)).map(x=>x.p==='__other'?{productId:'',name:x.n,qty:x.q,price:x.r}:{productId:x.p,qty:x.q,price:x.r});
    if(!items.length)return er('Add at least one item with a quantity.');
    if(items.some(i=>!i.productId&&!(i.price>0)))return er('Enter the selling price for the item that is not on the list.');
    if(items.some(i=>!(i.price>0)))return er('Every item needs a selling price. Ask the admin to set prices in Admin settings → Products.');
    LE.calc();if(tot<=0)return er('The total must be more than zero.');
    const f=Object.fromEntries(new FormData(form));const ps=form.pstatus.value;
    const paid=ps==='full'?tot:ps==='none'?0:r2(form.paid.value);
    if(ps==='part'&&!(paid>0&&paid<tot))return er(`For a part payment, enter an amount more than ₦0 and less than the total (${money(tot)}).`);
    if(rec){const later=sum(list('receipts').filter(r=>r.saleId===rec.id),'amount');if(paid+later>tot+0.004)return er(`Customer has already paid ${money(later)} after the sale; the total cannot be less than what has been paid.`)}
    if(!f.customer.trim()&&ps!=='full')return er('Enter the customer name for a sale that is not fully paid.');
    let seq=rec?rec.seq:0,inv=rec?rec.invoiceNo:'';
    if(!rec||rec.branchId!==bid()){seq=1+Math.max(0,...list('sales').filter(x=>x.branchId===bid()).map(x=>x.seq||0));inv=`${bcode(bid())}-${String(seq).padStart(5,'0')}`}
    const sale={...(rec||{}),branchId:bid(),date:f.date||today(),invoiceNo:inv,seq,customer:f.customer.trim(),phone:f.phone.trim(),method:ps==='none'?'':(form.method.value),payStatus:ps,items,subtotal:r2(sum(items,i=>i.qty*i.price)),discount:r2(f.discount),total:tot,paid,note:f.note,by:rec?rec.by:S.user.id,createdAt:rec?rec.createdAt:Date.now()};
    if(rec)sale.editedAt=Date.now();
    el.querySelector('#sSave').disabled=true;
    try{const r=await commit('sales',sale,rec);if(await finishSave(m,r,rec?'Sale updated':`Sale ${sale.invoiceNo} saved`)&&!rec&&r==='saved')ACT.viewSale(sale.id);else el.querySelector('#sSave').disabled=false}catch(err){el.querySelector('#sSave').disabled=false}
  }
}

ACT.editPurchase=id=>{const p=get('purchases',id);if(p)purchaseModal(p)};
function purchaseModal(rec){
  const isNew=!rec;const bid0=rec?rec.branchId:(scopeBranch()!=='all'?scopeBranch():'');
  const doneQty=new Map();if(rec)purItems(rec).forEach(i=>doneQty.set(i.pid,i.delivered));
  const m=openModal({title:rec?'Edit purchase order':'New purchase order',size:'wide',body:`<form id="purF" class="stack" style="gap:14px" novalidate>
    ${rec&&!isAdmin()?'<div class="note warn">Your change will be sent to the admin for approval.</div>':''}
    <div class="grid3"><label class="f">Branch receiving the stock${branchSelect('branchId',bid0,{id:'pBranch'})}</label><label class="f">Order date${dateInput('date',rec&&rec.date)}</label><label class="f">Supplier invoice / order no.<input class="in" name="ref" value="${esc(rec?rec.ref||'':'')}"></label></div>
    <label class="f">Supplier<input class="in" name="supplier" required list="supList" autocomplete="off" value="${esc(rec?rec.supplier:'')}"></label>
    <datalist id="supList">${[...new Set([...list('purchases').map(x=>x.supplier),...list('payables').map(x=>x.supplier),...list('openings').filter(o=>o.type==='payable').map(o=>o.party)].filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <div><div class="row" style="margin-bottom:8px"><b>Items ordered</b><div class="spacer"></div><span class="kbd">Item · Qty ordered · Unit cost${isNew?' · Delivered today':''} · Value</span></div><div class="lines" data-plines></div><button type="button" class="btn sm" data-addp style="margin-top:8px">${ic('plus')}Add item</button></div>
    ${isNew?'<div class="note">Under <b>Delivered today</b>, enter how much has already arrived (it starts equal to the quantity ordered). Enter 0 if nothing has arrived yet. Record later deliveries from Purchases → <b>Receive delivery</b>; the pending quantity reduces each time.</div>':`<div class="note">Deliveries so far: ${delivs(rec).length}. Record new deliveries with <b>Receive delivery</b>. You cannot order less than has already been delivered.</div>`}
    <div class="grid2"><div class="stack" style="gap:12px">${isNew?`<label class="f">Amount paid to supplier now (₦)<span class="hint">Leave 0 if not yet paid; the balance goes to Payables.</span><input class="in" name="paid" type="number" min="0" step="0.01" value="0" inputmode="decimal"></label><label class="f">Paid by<select class="in" name="method">${PAY_METHODS.map(x=>`<option>${x}</option>`).join('')}</select><div data-cashhint></div></label>`:`<div class="note">Payments for this order are in Payments (paid so far: ${money(sum(list('payments').filter(p=>p.purchaseId===rec.id),'amount'))}).</div>`}
    <label class="f">Payment due date<input class="in" type="date" name="due" value="${esc(rec?rec.due||'':'')}"></label></div><div class="sumbox" id="pSum"></div></div>
    <div id="pErr" role="alert"></div></form>`,
    foot:`<button class="btn" data-cancel>Cancel</button><button class="btn primary" id="pSave">${rec&&!isAdmin()?'Send for approval':'Save order'}</button>`});
  const el=m.el,form=el.querySelector('#purF'),box=el.querySelector('[data-plines]');
  const bid=()=>form.branchId.value;
  const html=l=>`<div class="line ${isNew?'p5':'p4'}"><select class="in" data-k="p" aria-label="Item"><option value="">Select item…</option>${prodOptions(bid()||'all',l&&l.productId)}</select><input class="in" data-k="q" type="number" min="0" step="any" inputmode="decimal" placeholder="Ordered" aria-label="Quantity ordered" value="${l?l.qty:''}"><input class="in" data-k="r" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Unit cost" aria-label="Unit cost" value="${l?l.cost:''}">${isNew?`<input class="in" data-k="d" type="number" min="0" step="any" inputmode="decimal" placeholder="Delivered" aria-label="Delivered today" value="${l?l.qty:''}">`:''}<div class="lt">₦0.00${!isNew&&l?`<div class="sub">delivered so far ${num(doneQty.get(l.productId)||0)}</div>`:''}</div><button type="button" class="icon-btn" data-k="x" aria-label="Remove item">×</button></div>`;
  const add=l=>{box.insertAdjacentHTML('beforeend',html(l));calc()};
  const lines=()=>$$('.line',box).map(l=>({l,p:l.querySelector('[data-k=p]').value,q:Number(l.querySelector('[data-k=q]').value)||0,r:Number(l.querySelector('[data-k=r]').value)||0,d:isNew?(Number(l.querySelector('[data-k=d]').value)||0):0}));
  let hint=()=>{};
  function calc(){let tot=0,dv=0;lines().forEach(x=>{const t=r2(x.q*x.r);tot+=t;dv+=x.d*x.r;x.l.querySelector('.lt').firstChild.textContent=money(t)});
    const paid=isNew?(Number(form.paid.value)||0):sum(list('payments').filter(p=>p.purchaseId===rec.id),'amount');
    el.querySelector('#pSum').innerHTML=`<div class="r big"><span>Order value</span><span>${money(tot)}</span></div>${isNew?`<div class="r"><span>Delivered today</span><span>${money(dv)}</span></div><div class="r"><span>Still to be delivered</span><b class="${tot-dv>0.004?'neg':''}">${money(tot-dv)}</b></div>`:''}<div class="r"><span>Paid</span><span>${money(paid)}</span></div><div class="r"><span>Owed to supplier</span><b class="${tot-paid>0.004?'neg':''}">${money(Math.max(0,tot-paid))}</b></div>`;hint()}
  box.addEventListener('change',e=>{if(e.target.dataset.k==='p'){const p=get('products',e.target.value);const r=e.target.closest('.line').querySelector('[data-k=r]');if(p&&!r.value)r.value=costMap().get(p.id)||p.cost||'';e.target.closest('.line').querySelector('[data-k=q]').focus()}calc()});
  box.addEventListener('input',e=>{if(isNew&&e.target.dataset.k==='q'){const d=e.target.closest('.line').querySelector('[data-k=d]');if(!d.dataset.touched)d.value=e.target.value}if(e.target.dataset.k==='d')e.target.dataset.touched=1;calc()});
  box.addEventListener('click',e=>{if(e.target.closest('[data-k=x]')){e.target.closest('.line').remove();if(!$$('.line',box).length)add();calc()}});
  el.querySelector('[data-addp]').onclick=()=>{add();$$('.line select',box).pop().focus()};
  (rec?rec.lines:[null]).forEach(l=>add(l));
  if(isNew){form.paid.addEventListener('input',calc);hint=wireCashHint(form,{out:true,amt:'paid'})}
  const bs=form.querySelector('#pBranch');if(bs)bs.addEventListener('change',()=>{box.innerHTML='';add()});
  form.addEventListener('submit',e=>{e.preventDefault();save()});el.querySelector('#pSave').onclick=save;

    if(new Set(ls.map(x=>x.p)).size!==ls.length)return er('Each item should appear once. Combine the quantities on one line.');

    if(rec){const bad=[...doneQty.entries()].find(([pid,q])=>q>0&&(ls.find(x=>x.p===pid)||{q:0}).q<q);if(bad)return er(`${pname(bad[0])}: ${num(bad[1])} has already been delivered, so the order cannot be less than that.`)}
    const total=r2(sum(ls,x=>x.q*x.r));const paid=isNew?r2(f.paid):0;

    if(rec){const done=sum(list('payments').filter(p=>p.purchaseId===rec.id),'amount');if(done>total+0.004)return er(`${money(done)} has already been paid; the order value cannot be less.`)}
    const pur={...(rec||{}),branchId:bid(),date:f.date,supplier:f.supplier.trim(),ref:f.ref,due:f.due,lines:ls.map(x=>({productId:x.p,qty:x.q,cost:x.r})),total,by:rec?rec.by:S.user.id,createdAt:rec?rec.createdAt:Date.now()};
    if(rec){pur.deliveries=clone(delivs(rec));pur.editedAt=Date.now()}
    else{pur.id=uid();const dl=ls.filter(x=>x.d>0).map(x=>({productId:x.p,qty:x.d}));pur.deliveries=dl.length?[{id:uid(),date:f.date,lines:dl,note:'Delivered with the order',by:S.user.id,at:Date.now()}]:[]}
    el.querySelector('#pSave').disabled=true;

      if(isNew&&r==='saved'&&paid>0)await Store.put('payments',{kind:'supplier',category:'Supplier payment',branchId:pur.branchId,date:pur.date,payee:pur.supplier,description:`Payment for order ${pur.ref||''}`.trim(),amount:paid,method:f.method,ref:pur.ref||'',purchaseId:pur.id,by:S.user.id,createdAt:Date.now()});
      const pendNow=isNew?sum(purItems(pur),'pending'):0;
      if(!await finishSave(m,r,rec?'Order updated':(pendNow?`Order saved. ${num(pendNow)} unit(s) pending delivery.`:'Order saved; stock added')))el.querySelector('#pSave').disabled=false}catch(err){el.querySelector('#pSave').disabled=false}
  }
}
ACT.deliver=id=>{
  const p=get('purchases',id);if(!p)return;const it=purItems(p).filter(i=>i.pending>0);
  if(!it.length)return toast('Everything on this order has been delivered.');
  const m=openModal({title:`Receive delivery — ${esc(p.supplier)}${p.ref?' '+esc(p.ref):''}`,size:'wide',body:`<form id="dvF" class="stack" style="gap:12px">
    <p class="kbd" style="margin:0">Ordered on ${fdate(p.date)} for ${esc(bname(p.branchId))}. Enter what arrived in this delivery; the rest stays pending.</p>
    <div class="grid2"><label class="f">Date delivered${dateInput('date')}</label><label class="f">Waybill / driver / note<input class="in" name="note"></label></div>
    <div class="tw card"><table><thead><tr><th>Item</th><th class="n">Ordered</th><th class="n">Delivered so far</th><th class="n">Pending</th><th style="width:150px">Delivered now</th><th class="n">Pending after</th></tr></thead><tbody>
    ${it.map(i=>`<tr data-p="${i.pid}" data-pend="${i.pending}"><td><b>${esc(pname(i.pid))}</b><div class="sub">per ${esc(punit(i.pid))}</div></td><td class="n">${num(i.ordered)}</td><td class="n">${num(i.delivered)}</td><td class="n neg">${num(i.pending)}</td><td><input class="in" type="number" min="0" max="${i.pending}" step="any" inputmode="decimal" value="${i.pending}" data-q aria-label="Delivered now: ${esc(pname(i.pid))}"></td><td class="n" data-after>0</td></tr>`).join('')}</tbody></table></div>
    <div id="dvErr" role="alert"></div><button class="btn primary" type="submit">Save delivery</button></form>`});
  const form=m.el.querySelector('#dvF');
  const upd=()=>$$('tr[data-p]',form).forEach(tr=>{const a=r2(Number(tr.dataset.pend)-(Number(tr.querySelector('[data-q]').value)||0));const c=tr.querySelector('[data-after]');c.textContent=num(a);c.className='n '+(a<0?'neg':a>0?'':'pos')});
  form.addEventListener('input',upd);upd();
  form.addEventListener('submit',async e=>{e.preventDefault();const er=errBox(m,'#dvErr');
    const lines=$$('tr[data-p]',form).map(tr=>({productId:tr.dataset.p,qty:r2(tr.querySelector('[data-q]').value),pend:Number(tr.dataset.pend)}));
    if(lines.some(l=>l.qty<0))return er('Quantities cannot be negative.');
    const bad=lines.find(l=>l.qty>l.pend+0.0001);if(bad)return er(`${pname(bad.productId)}: only ${num(bad.pend)} is pending.`);
    const got=lines.filter(l=>l.qty>0).map(l=>({productId:l.productId,qty:l.qty}));if(!got.length)return er('Enter the quantity delivered for at least one item.');
    const cur=get('purchases',id);const d={id:uid(),date:form.date.value,lines:got,note:form.note.value,by:S.user.id,at:Date.now()};
    try{await Store.put('purchases',{...cur,deliveries:[...clone(delivs(cur)),d]});
      const left=sum(purItems(get('purchases',id)),'pending');
      await log('Delivery received',`${cur.supplier}: ${got.map(l=>`${num(l.qty)} ${pname(l.productId)}`).join(', ')}; pending ${num(left)}`);
      closeModal(m);toast(left?`Delivery saved. Still pending: ${num(left)} unit(s).`:'Delivery saved. The order is now fully delivered.')}catch(err){}});
};

ACT.delDelivery=async key=>{
  const [pid,did]=key.split(':');const p=get('purchases',pid);if(!p)return;const d=delivs(p).find(x=>x.id===did);if(!d)return;
  if(isAdmin()&&!await ask(`Remove the delivery of ${fdate(d.date)} (${(d.lines||[]).map(l=>`${num(l.qty)} ${esc(pname(l.productId))}`).join(', ')})? Those quantities go back to pending and come out of stock.`,'Remove delivery',true))return;
  const after={...p,deliveries:clone(delivs(p)).filter(x=>x.id!==did),editedAt:Date.now()};

/* ----- cash entries ----- */
const CASH_TYPES={cashin:'Add Extra Cash',cashout:'Cash Reduction',lodge:'Record Cash Deposit',withdraw:'Cash withdrawn from bank'};
ACT.cashMove=type=>cashMoveModal(null,type);
ACT.editCashMove=id=>{const c=get('cashmoves',id);if(c)cashMoveModal(c)};
function cashMoveModal(rec,type){
  type=rec?rec.type:(type||'cashin');
  const help={cashin:'Cash brought into the branch that is not from a sale, e.g. money from the owner or a loan.',cashout:'Cash taken out of the branch that is not a recorded payment or expense, e.g. owner drawings.',lodge:'Cash taken from the branch and paid into the bank.',withdraw:'Cash taken out of the bank and brought to the branch.'}[type];
  const m=openModal({title:rec?`Edit: ${CASH_TYPES[type]}`:CASH_TYPES[type],body:`<form id="cmF" class="stack" style="gap:12px">

/* =========================================================
   CAMERA COUNTER — opens the BACK camera straight away, counts
   live while you aim, tells you what to do, then lets you check
   the marks on a sharp photo before saving.
   ========================================================= */
const Camera={
  async open(want){
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))throw Object.assign(new Error('This browser cannot open the camera.'),{name:'NoCamera'});
    want=want||'environment';
    const base={width:{ideal:1920},height:{ideal:1080}};
    try{return await navigator.mediaDevices.getUserMedia({audio:false,video:{...base,facingMode:{exact:want}}})}
    catch(e){if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))throw e}
    let s=await navigator.mediaDevices.getUserMedia({audio:false,video:{...base,facingMode:{ideal:want}}});
    try{
      const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
      const re=want==='environment'?/back|rear|environment|world/i:/front|user|face/i;
      const pick=devs.filter(d=>re.test(d.label)).pop();const cur=s.getVideoTracks()[0].getSettings().deviceId;
      if(pick&&pick.deviceId&&pick.deviceId!==cur){s.getTracks().forEach(t=>t.stop());s=await navigator.mediaDevices.getUserMedia({audio:false,video:{...base,deviceId:{exact:pick.deviceId}}})}
    }catch(e){}
    return s;
  }
};

      const R=Math.max(3,(st.prm.size||st.autoSize||20)/2*.75);x.lineWidth=lw;
      st.auto.forEach((q,i)=>{if(st.removed.has(i))return;x.beginPath();x.arc(q.x,q.y,R,0,7);x.strokeStyle='#22c55e';x.stroke();x.beginPath();x.arc(q.x,q.y,Math.max(1.5,lw),0,7);x.fillStyle='#22c55e';x.fill()});
      st.manual.forEach(q=>{x.beginPath();x.arc(q.x,q.y,R,0,7);x.strokeStyle='#f97316';x.stroke();x.beginPath();x.arc(q.x,q.y,Math.max(1.5,lw),0,7);x.fillStyle='#f97316';x.fill()});
      // number every item so each one can be checked against the photo
      if(st.counted&&R>=6){const fs=Math.max(8,Math.min(R*1.05,22));x.save();x.font=`800 ${fs}px Manrope,Arial,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.lineWidth=Math.max(2,fs/4);x.strokeStyle='rgba(0,0,0,.85)';let k=0;
        const lab=(q,col)=>{k++;x.strokeText(String(k),q.x,q.y);x.fillStyle=col;x.fillText(String(k),q.x,q.y)};
        st.auto.forEach((q,i)=>{if(!st.removed.has(i))lab(q,'#fff')});st.manual.forEach(q=>lab(q,'#ffd8b0'));x.restore()}
    } else if(st.method==='stack'){
      const r=st.roi||st.gridArea||{x:0,y:0,w:st.w,h:st.h},g=st.grid;x.save();x.strokeStyle='#22c55e';x.lineWidth=lw;
      for(let i=0;i<=g.rows;i++){const yy=r.y+r.h*i/g.rows;x.beginPath();x.moveTo(r.x,yy);x.lineTo(r.x+r.w,yy);x.stroke()}
      x.strokeStyle='#38bdf8';for(let j=0;j<=g.cols;j++){const xx=r.x+r.w*j/g.cols;x.beginPath();x.moveTo(xx,r.y);x.lineTo(xx,r.y+r.h);x.stroke()}
      x.restore();
    } else {
      const R=Math.max(9,Math.min(st.w,st.h)/55);x.font=`bold ${Math.round(R*1.05)}px Manrope,sans-serif`;x.textAlign='center';x.textBaseline='middle';
      st.taps.forEach((q,i)=>{x.beginPath();x.arc(q.x,q.y,R,0,7);x.fillStyle='rgba(196,80,26,.9)';x.fill();x.lineWidth=2;x.strokeStyle='#fff';x.stroke();x.fillStyle='#fff';x.fillText(String(i+1),q.x,q.y+1)});
    }
    if(target){const n=this.count();const fs=Math.max(18,Math.round(st.w/28));x.fillStyle='rgba(17,22,30,.82)';x.fillRect(0,st.h-fs*2.2,st.w,fs*2.2);x.fillStyle='#fff';x.font=`bold ${fs}px Manrope,sans-serif`;x.textAlign='left';x.textBaseline='middle';
      x.fillText(`${pname(st.opts.productId)}: ${n.toLocaleString()}  ·  ${bname(st.opts.branchId)}  ·  ${new Date().toLocaleString('en-GB')}`,fs*.6,st.h-fs*1.1,st.w-fs*1.2)}
  },
  snapshot(){
    const st=this.st;const c=document.createElement('canvas');c.width=st.w;c.height=st.h;this.draw(c);
    let w=st.w,h=st.h,q=.72,url;
    for(let k=0;k<8;k++){const sc=Math.min(1,900/Math.max(w,h));const o=document.createElement('canvas');o.width=Math.round(w*sc);o.height=Math.round(h*sc);o.getContext('2d').drawImage(c,0,0,o.width,o.height);url=o.toDataURL('image/jpeg',q);if(url.length<200000)break;q-=.08;if(q<.4){w*=.8;h*=.8;q=.6}}
    return url;
  },
  finish(){const st=this.st;if(!st.base||st.mode!=='review')return;this.steps(3);const res={qty:this.count(),method:st.method,detail:this.detail(),dataUrl:this.snapshot()};const cb=st.opts.onDone;closeModal(this.m);this.st=null;cb&&cb(res)}
};

/* ---------- image analysis: separate round items (rod ends, rolls) ---------- */
function detectItems(gray,w,h,roi,prm,inside){
  // inside: optional mask (1 = inside the circle the user drew). Pixels outside are ignored completely.
  const IN=i=>!inside||inside[i];
  const x0=Math.max(1,roi.x),y0=Math.max(1,roi.y),x1=Math.min(w-1,roi.x+roi.w),y1=Math.min(h-1,roi.y+roi.h);
  // 1. light smoothing (removes grain/noise)
  const sm=new Uint8Array(w*h);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;sm[i]=(gray[i-w-1]+2*gray[i-w]+gray[i-w+1]+2*gray[i-1]+4*gray[i]+2*gray[i+1]+gray[i+w-1]+2*gray[i+w]+gray[i+w+1])>>4}
  // 2. global threshold (Otsu) inside the selection — first guess of item size
  const hist=new Uint32Array(256);let n=0;
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const i=y*w+x;if(IN(i)){hist[sm[i]]++;n++}}
  let tot=0;for(let i=0;i<256;i++)tot+=i*hist[i];
  let sB=0,wB=0,best=-1,th=127;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=t*hist[t];const mB=sB/wB,mF=(tot-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;th=t}}
  const light=prm.pol!=='dark';
  const binGlobal=i=>{const v=sm[i];return light?v>th-prm.sens:v<th+prm.sens};
  const morph=(src,erode)=>{const o=new Uint8Array(w*h);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const i=y*w+x;if(erode)o[i]=src[i]&&src[i-1]&&src[i+1]&&src[i-w]&&src[i+w]?1:0;else o[i]=src[i]||src[i-1]||src[i+1]||src[i-w]||src[i+w]?1:0}return o};
  const dist=mask=>{const D=new Float32Array(w*h);for(let i=0;i<w*h;i++)D[i]=mask[i]?1e6:0;
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;if(!D[i])continue;D[i]=Math.min(D[i],D[i-1]+1,D[i-w]+1,D[i-w-1]+1.414,D[i-w+1]+1.414)}
    for(let y=h-2;y>=1;y--)for(let x=w-2;x>=1;x--){const i=y*w+x;if(!D[i])continue;D[i]=Math.min(D[i],D[i+1]+1,D[i+w]+1,D[i+w+1]+1.414,D[i+w-1]+1.414)}return D};
  const build=fn=>{const m=new Uint8Array(w*h);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const i=y*w+x;if(IN(i)&&fn(i))m[i]=1}return morph(morph(m,true),false)};
  const peaks=D=>{const c=[];for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const i=y*w+x,v=D[i];if(v<2)continue;
    if(v>=D[i-1]&&v>=D[i+1]&&v>=D[i-w]&&v>=D[i+w]&&v>=D[i-w-1]&&v>=D[i-w+1]&&v>=D[i+w-1]&&v>=D[i+w+1])c.push({x,y,v})}return c};
  const sizeOf=c=>{const vs=c.map(q=>q.v).sort((a,b)=>a-b);if(!vs.length)return 0;const top=vs.slice(Math.floor(vs.length*.5));return Math.max(3,top[Math.floor(top.length*.5)])};
  let mask=build(binGlobal),D=dist(mask),cand=peaks(D);
  let R=prm.size>0?prm.size/2:sizeOf(cand);
  // 3. even out the lighting: divide by the broad brightness around each spot, then threshold again.
  //    Shade, sunlight from one side or a dark corner then no longer hide items.
  if(prm.adaptive!==false&&R>=3){
    const k=Math.max(6,Math.round(R*4)),W1=w+1,I=new Float64Array(W1*(h+1)),C=new Float64Array(W1*(h+1));
    for(let y=0;y<h;y++){let row=0,rc=0;for(let x=0;x<w;x++){const i=y*w+x,ins=IN(i)?1:0;row+=sm[i]*ins;rc+=ins;I[(y+1)*W1+x+1]=I[y*W1+x+1]+row;C[(y+1)*W1+x+1]=C[y*W1+x+1]+rc}}
    const box=(A,x,y)=>{const a=Math.max(0,x-k),b=Math.max(0,y-k),c=Math.min(w,x+k+1),d=Math.min(h,y+k+1);return A[d*W1+c]-A[b*W1+c]-A[d*W1+a]+A[b*W1+a]};
    const nv=new Uint8Array(w*h);const h2=new Uint32Array(256);let n2=0;
    for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const i=y*w+x;if(!IN(i))continue;const m=box(I,x,y)/Math.max(1,box(C,x,y));const v=Math.max(0,Math.min(255,Math.round(sm[i]/Math.max(8,m)*110)));nv[i]=v;h2[v]++;n2++}
    let t2=0;for(let i=0;i<256;i++)t2+=i*h2[i];let sb=0,wb=0,bb=-1,th2=110;
    for(let t=0;t<256;t++){wb+=h2[t];if(!wb)continue;const wf=n2-wb;if(!wf)break;sb+=t*h2[t];const mb=sb/wb,mf=(t2-sb)/wf,v=wb*wf*(mb-mf)*(mb-mf);if(v>bb){bb=v;th2=t}}
    mask=build(i=>light?nv[i]>th2-prm.sens:nv[i]<th2+prm.sens);
    D=dist(mask);cand=peaks(D);if(!(prm.size>0)){const R2=sizeOf(cand);if(R2)R=R2}
  }
  if(!cand.length||!R)return {pts:[],size:20,thr:th,mask};
  // 4. one mark per item: strongest centres first, never two marks closer than an item's width
  cand.sort((a,b)=>b.v-a.v);
  const minPeak=R*.45,minD=R*1.25,cell=Math.max(2,minD),gw=Math.ceil(w/cell)+1,grid=new Map(),pts=[];
  for(const c of cand){if(c.v<minPeak)break;const gx=Math.floor(c.x/cell),gy=Math.floor(c.y/cell);let ok=true;
    for(let yy=gy-1;yy<=gy+1&&ok;yy++)for(let xx=gx-1;xx<=gx+1&&ok;xx++){const a=grid.get(yy*gw+xx);if(a)for(const p of a)if(Math.hypot(p.x-c.x,p.y-c.y)<minD){ok=false;break}}
    if(ok){pts.push(c);const kk=gy*gw+gx;if(!grid.has(kk))grid.set(kk,[]);grid.get(kk).push(c)}}
  // reading order (top to bottom, left to right) so the numbers on the photo are easy to follow
  const rowH=R*1.6;pts.sort((a,b)=>Math.round(a.y/rowH)-Math.round(b.y/rowH)||a.x-b.x);
  return {pts:pts.map(p=>({x:p.x,y:p.y})),size:R*2,thr:th,mask};
}
/* ---------- image analysis: stacked bags (layers × columns) ---------- */
function detectStack(gray,w,h,roi,auto){
  const P=new Float64Array(roi.h),Q=new Float64Array(roi.w);
  for(let y=Math.max(1,roi.y);y<Math.min(h-1,roi.y+roi.h);y++)for(let x=roi.x;x<roi.x+roi.w;x++){const i=y*w+x;P[y-roi.y]+=Math.abs(gray[i+w]-gray[i-w])}
  for(let y=roi.y;y<roi.y+roi.h;y++)for(let x=Math.max(1,roi.x);x<Math.min(w-1,roi.x+roi.w);x++){const i=y*w+x;Q[x-roi.x]+=Math.abs(gray[i+1]-gray[i-1])}
  const a=dominantPeriod(P),b=dominantPeriod(Q);
  if(!auto)return {rows:a.p?Math.max(1,Math.round(roi.h/a.p)):1,cols:b.p?Math.max(1,Math.round(roi.w/b.p)):1,rc:a.r,cc:b.r};
  const ext=(A,p)=>{const n=A.length;if(!p)return [0,n];const k=Math.max(1,p),cs=new Float64Array(n+1);for(let i=0;i<n;i++)cs[i+1]=cs[i]+A[i];
    const Sm=new Float64Array(n);let mx=0;for(let i=0;i<n;i++){const lo=Math.max(0,i-(k>>1)),hi=Math.min(n,lo+k);Sm[i]=(cs[hi]-cs[lo])/(hi-lo);if(Sm[i]>mx)mx=Sm[i]}
    let i0=0,i1=n-1;while(i0<n&&Sm[i0]<mx*.4)i0++;while(i1>0&&Sm[i1]<mx*.4)i1--;
    i0=Math.min(n-1,i0+Math.round(p/2));i1=Math.max(i0+1,i1-Math.round(p/2));return [i0,i1]};
  const [y0,y1]=ext(P,a.p),[x0,x1]=ext(Q,b.p);
  const r={x:roi.x+x0,y:roi.y+y0,w:x1-x0,h:y1-y0};
  return {rows:a.p?Math.max(1,Math.round(r.h/a.p)):1,cols:b.p?Math.max(1,Math.round(r.w/b.p)):1,rc:a.r,cc:b.r,area:(r.w>20&&r.h>20)?r:null};
}
function dominantPeriod(P){
  const n=P.length;if(n<16)return {p:0,r:0};
  const win=Math.max(5,Math.round(n/4));const cs=new Float64Array(n+1);for(let i=0;i<n;i++)cs[i+1]=cs[i]+P[i];
  const X=new Float64Array(n);for(let i=0;i<n;i++){const a=Math.max(0,i-win),b=Math.min(n,i+win+1);X[i]=P[i]-(cs[b]-cs[a])/(b-a)}
  let v0=0;for(let i=0;i<n;i++)v0+=X[i]*X[i];if(v0<=0)return {p:0,r:0};
  const minL=Math.max(4,Math.floor(n/80)),maxL=Math.floor(n/1.6);const ac=new Float64Array(maxL+2);
  for(let L=minL;L<=maxL+1;L++){let s=0;for(let i=0;i+L<n;i++)s+=X[i]*X[i+L];ac[L]=s/v0}
  let best=0,bl=0;for(let L=minL+1;L<=maxL;L++)if(ac[L]>ac[L-1]&&ac[L]>=ac[L+1]&&ac[L]>best){best=ac[L];bl=L}
  if(!bl)return {p:0,r:0};
  for(let L=minL+1;L<bl;L++)if(ac[L]>ac[L-1]&&ac[L]>=ac[L+1]&&ac[L]>=best*.85&&ac[L]>.15){bl=L;best=ac[L];break}
  return {p:bl,r:best};
}
