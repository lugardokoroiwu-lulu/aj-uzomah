<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#18202b;--ink2:#26313f;--ink3:#3a4757;
  --bg:#f3f2ee;--card:#ffffff;--line:#e2dfd8;--line2:#efede8;
  --muted:#667080;--accent:#c4501a;--accent-d:#a3420f;--accent-l:#fbe9df;
  --ok:#1f7a4d;--ok-l:#e3f3ea;--warn:#a86a12;--warn-l:#fdf1dc;--bad:#b42318;--bad-l:#fde8e6;
  --info:#24588f;--info-l:#e4eef8;
  --r:12px;--sh:0 1px 2px rgba(24,32,43,.06),0 4px 14px rgba(24,32,43,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f0a35e;outline-offset:2px;border-radius:6px}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{background:#faf9f6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--bad);border-color:#f1c4bf}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.icon-btn{border:0;background:transparent;width:38px;height:38px;border-radius:9px;cursor:pointer;font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--line2)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink3)}
label.f .hint{font-weight:500;color:var(--muted);font-size:12px}
.in,select.in,textarea.in{width:100%;border:1px solid #d6d2c9;background:#fff;border-radius:10px;padding:9px 11px;min-height:42px;font-size:15px;font-weight:500;color:var(--ink)}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px #f6c9ae}
.in[readonly]{background:#f6f5f2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14px;cursor:pointer;padding:6px 0}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px;flex:none}
.check small{display:block;font-weight:500;color:var(--muted)}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-art{background:var(--ink);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art::after{content:"";position:absolute;right:-160px;bottom:-160px;width:420px;height:420px;border-radius:50%;border:56px solid rgba(196,80,26,.25)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:11px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;letter-spacing:.5px;flex:none}
.brand b{display:block;font-size:16px;letter-spacing:.3px}
.brand span{font-size:12px;opacity:.7}
.auth-art h1{font-size:38px;line-height:1.1;margin:0 0 14px;max-width:440px;letter-spacing:-.5px}
.auth-art p{opacity:.75;max-width:420px;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.chips span{border:1px solid rgba(255,255,255,.2);padding:6px 11px;border-radius:99px;font-size:12.5px}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.auth-card{width:100%;max-width:420px}
.auth-card h2{font-size:26px;margin:0 0 6px;letter-spacing:-.3px}
.auth-card .sub{color:var(--muted);margin:0 0 22px}
.auth-card form{display:flex;flex-direction:column;gap:14px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth-art{padding:26px 22px}.auth-art h1{font-size:26px}.auth-art::after{display:none}.auth-art .chips{display:none}}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:var(--ink);color:#d9dee6;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:4px 8px 18px;color:#fff}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:#c8cfd9;font-weight:600;cursor:pointer;text-align:left;width:100%;font-size:14.5px}
.nav svg{width:19px;height:19px;flex:none;opacity:.85}
.nav:hover{background:var(--ink2);color:#fff}
.nav[aria-current="page"]{background:var(--accent);color:#fff}
.nav .badge{margin-left:auto;background:#fff;color:var(--accent);border-radius:99px;font-size:11px;padding:1px 7px;font-weight:800}
.side .sep{height:1px;background:#2f3a49;margin:10px 6px}
.side .me{margin-top:auto;padding:12px;border-radius:10px;background:var(--ink2);font-size:13px}
.side .me b{color:#fff;display:block}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.top h1{font-size:21px;margin:0;letter-spacing:-.3px}
.menu-btn{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px 7px 9px;font:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;min-height:40px}
.menu-btn svg{width:20px;height:20px}
.bnav{display:none}
.view{padding:22px 24px 60px;max-width:1320px;width:100%}
.mode{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap}
.mode.shared{background:var(--ok-l);color:var(--ok)}
.mode.local{background:var(--warn-l);color:var(--warn)}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:50;transform:translateX(-100%);transition:transform .2s;height:100%}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .menu-btn{display:inline-flex}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.18)}
  .bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:#aeb7c4;font:inherit;font-size:11.5px;font-weight:600;padding:6px 2px;border-radius:10px;cursor:pointer;min-width:0}
  .bn svg{width:22px;height:22px}
  .bn[aria-current=page]{color:#fff;background:rgba(255,255,255,.09)}
  .bn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bdot{background:var(--accent);color:#fff;border-radius:99px;padding:0 5px;font-size:10px}
  .view{padding-bottom:96px!important}
  #toasts{bottom:84px!important}
  .top{padding:10px 14px}
  .top h1{font-size:18px}
  .view{padding:16px 14px 70px}
  .top .mode{display:none}
}
@media(max-width:620px){
  .top{flex-wrap:wrap;row-gap:8px}
  .top .spacer{display:none}
  #topRight{flex-basis:100%}
  #topRight select{width:100%!important;flex:1}
}

/* ---------- cards / kpis ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.pad{padding:18px}
.card h3{margin:0;font-size:15.5px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.4px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.accent{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpi.accent .l,.kpi.accent .s{color:#aeb8c6}
.dash{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
@media(max-width:1000px){.dash{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.toolbar label.f{min-width:140px}
.toolbar .grow{flex:1;min-width:180px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfaf8;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;background:#fbfaf8;border-top:1px solid var(--line)}
td .sub{font-size:12px;color:var(--muted)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-l);color:var(--ok)}.pill.warn{background:var(--warn-l);color:var(--warn)}
.pill.bad{background:var(--bad-l);color:var(--bad)}.pill.info{background:var(--info-l);color:var(--info)}
.pill.mute{background:#eeece7;color:var(--ink3)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}

/* ---------- charts ---------- */
.bars{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
.bar-row{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;font-size:13.5px}
.bar-track{height:12px;background:#f0eee9;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:99px}
@media(max-width:620px){.bar-row{grid-template-columns:100px 1fr 90px;font-size:12.5px}}
.chart svg{width:100%;height:auto;display:block}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(17,22,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:80;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;margin-bottom:4vh}
.modal.wide{max-width:900px}
.modal.full{max-width:1100px}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line2)}
.modal header h2{margin:0;font-size:18px;flex:1}
.mbody{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line2);flex-wrap:wrap;background:#fbfaf8;border-radius:0 0 16px 16px}
@media(max-width:620px){.overlay{padding:0}.modal{border-radius:0;min-height:100%;margin:0}.modal footer{border-radius:0;position:sticky;bottom:0}}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:1fr 90px 120px 110px 38px;gap:8px;align-items:center}.sendbtns{display:flex;gap:8px;flex-wrap:wrap}.sendbtns .btn{flex:1;min-width:150px;justify-content:center}.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.shareview{max-width:820px;margin:0 auto;padding:16px}.shtop{display:flex;gap:8px;justify-content:center;margin:0 auto 12px;max-width:820px;padding:16px 16px 0}
.shpaper{position:relative;overflow:hidden;background:#fff;margin:0 auto 24px;max-width:800px;box-shadow:0 2px 14px rgba(0,0,0,.12);border-radius:6px;padding:18px}.shpaper.rc{max-width:360px;padding:6px}
.shwm{position:absolute;top:45%;left:-20%;right:-20%;text-align:center;transform:rotate(-35deg);font:900 clamp(60px,14vw,130px)/1 Arial,sans-serif;letter-spacing:8px;color:rgba(196,80,26,.11);pointer-events:none;z-index:2}
.sigbox{border:1px dashed var(--line);border-radius:10px;min-height:84px;display:flex;align-items:center;justify-content:center;background:#fff;padding:8px}.sigbox img{max-height:80px;max-width:100%}
.sigpad{width:100%;height:200px;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
.fixedbr{padding:9px 0;font-weight:700;min-height:40px;display:flex;align-items:center}.itemcell{display:flex;flex-direction:column;gap:6px;min-width:0}
.line .lt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:620px){.line{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:10px}.line select,.line .itemcell{grid-column:1/-1}.line .lt{text-align:left}}
.sumbox{background:#faf8f4;border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sumbox .r{display:flex;justify-content:space-between;gap:10px}
.sumbox .r.big{font-size:18px;font-weight:800}
.note{background:var(--info-l);color:#1d4471;border-radius:10px;padding:10px 13px;font-size:13.5px}
.note.warn{background:var(--warn-l);color:#7a4c0b}
.note.bad{background:var(--bad-l);color:#8c1c13}

/* ---------- toast ---------- */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:120;width:min(92vw,440px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-weight:600;font-size:14px}
.toast.bad{background:var(--bad)}

/* ---------- camera ---------- */
.cam-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cam-methods label{border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;font-size:13px}
.cam-methods label b{display:block;font-size:14px}
.cam-methods input{accent-color:var(--accent);margin-top:3px}
.cam-methods label:has(input:checked){border-color:var(--accent);background:var(--accent-l)}
@media(max-width:700px){.cam-methods{grid-template-columns:1fr}}
.cam-stage{position:relative;background:#11161e;border-radius:12px;overflow:hidden;display:flex;justify-content:center}
.cam-stage canvas{max-width:100%;max-height:62vh;display:block;cursor:crosshair;touch-action:none}
.cam-result{display:flex;gap:14px;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px}.cam-result .big{font-size:34px;font-weight:800}
.cam-circlebar{display:flex}
@media(max-width:700px){.cam-stage canvas{max-height:50vh}.cam-guide-box{font-size:13.5px;padding:9px 11px}.cam-steps{display:none!important}}
.cam-help{font-size:13px;color:var(--muted);margin:-4px 0 0;line-height:1.45}
.cam-circlebar{display:flex;gap:8px;flex-wrap:wrap}.cam-countbtn{min-width:150px;font-size:16px}
.cam-stage canvas{touch-action:none}
.cam-count{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;flex-wrap:wrap}
.cam-count .big{font-size:38px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.cam-count .lbl{font-size:12px;color:#aeb8c6}
.cam-ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .in{text-align:center;min-width:70px}
input[type=range]{width:100%;accent-color:var(--accent)}
.photo-btns{display:flex;gap:10px;flex-wrap:wrap}
.photo-btns label{cursor:pointer}
.photo-btns input{position:absolute;opacity:0;width:1px;height:1px}
.photo-btns label:focus-within{outline:3px solid #f0a35e;outline-offset:2px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.loading{min-height:100vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid #ddd;border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{padding:9px 24px;font-size:13px;font-weight:600}
.banner.warn{background:var(--warn-l);color:#7a4c0b}
.banner.bad{background:var(--bad-l);color:#8c1c13}
.kbd{font-size:12px;color:var(--muted)}

.btn.icon{padding:0;width:34px;min-height:34px}
.btn.icon svg{width:17px;height:17px}
.card .pad,.pad{padding:16px 18px}
.card-h>svg{width:20px;height:20px;flex:none}
.dash>*,.stack>*{min-width:0}
html,body{overflow-x:hidden}
@media(max-width:620px){.kpis{grid-template-columns:1fr 1fr;gap:8px}.kpi{padding:11px 12px}.kpi .v{font-size:18px}.kpi .l{font-size:11.5px}}
.statement p{margin:0 0 12px;line-height:1.65;font-size:14.5px}
.statement p:last-child{margin:0}
table.pl td{padding:8px 12px}table.pl tr.sub td{font-weight:700}table.pl tr.tot td{font-weight:800;background:#faf8f4;border-top:2px solid var(--line)}table.pl td.ind{padding-left:30px}
.cam-live{position:relative;background:#000;border-radius:12px;overflow:hidden;display:flex;justify-content:center}
.cam-live video{width:100%;max-height:68vh;object-fit:contain;display:block}
.cam-guide{position:absolute;inset:8%;border:2px dashed rgba(255,255,255,.55);border-radius:10px;pointer-events:none}
[hidden]{display:none!important}
.side .me .btn{color:var(--ink)}
.side .me .btn.dark{color:#fff;background:var(--accent);border-color:var(--accent)}

.btn.og{border:1.5px solid #2f6b4f;color:#2f6b4f;background:#fff;font-weight:700}
.btn.og:hover{background:#eef6f1}.btn.og svg{color:#7c5cbf}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)})}

const IDB={db:null,
 open(){return new Promise((res,rej)=>{try{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('ajuz-lulubooks',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv')};r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>rej(r.error||new Error('idb error'));r.onblocked=()=>rej(new Error('idb blocked'))}catch(e){rej(e)}})},

};

const Store={
 mode:'local',kind:'local',db:null,warm:(()=>{try{return !!FIREBASE_CONFIG&&localStorage.getItem('ajuz_fbwarm_'+FIREBASE_CONFIG.projectId)==='1'}catch(e){return false}})(),local:'memory',_q:Promise.resolve(),mem:new Map(),
 async init(){
   let db=null;
   try{
     const framed=(()=>{try{return window.top!==window.self}catch(e){return true}})();   // on its own website there is no claude.ai to wait for
     for(let i=0;framed&&i<12&&!(window.claude&&typeof window.claude.use==='function');i++)await sleep(100);
     if(window.claude&&typeof window.claude.use==='function'){

       const lim=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);

     }
   }catch(e){db=null}
   if(!db&&FIREBASE_CONFIG&&!S.inArtifact){
     try{
       const v='10.12.2';
       await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
       await Promise.all([loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`),loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`)]);
       if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
       const fdb=firebase.firestore();
       try{fdb.settings({cacheSizeBytes:firebase.firestore.CACHE_SIZE_UNLIMITED,merge:true})}catch(e){}   // never throw records out of the phone's copy
       try{await fdb.enablePersistence({synchronizeTabs:true});Store.persist=true}catch(e){Store.persist=false}
       const auth=firebase.auth();
       const known=await Promise.race([new Promise(r=>{const un=auth.onAuthStateChanged(u=>{un();r(u)})}),sleep(8000).then(()=>null)]);
       if(!known){try{await auth.signInAnonymously()}catch(e){S.fbAuthErr=fbAuthMsg(e)}}
       db=fdb;this.kind='firebase';
     }catch(e){
       // The Firebase code could not be loaded (usually no internet on first open). Do NOT fall back to an
       // empty device-only store: that would hide the cloud records and split the books. Open read-only instead.
       S.fbErr='The cloud database could not be reached (no internet connection?). Records cannot be shown or saved until the device is online. Connect and reload the page.';
       S.readOnly=true;S.fbOffline=true;db=null;
     }
   }
   if(db){this.mode='shared';this.db=db;await this.subscribeAll();
     try{if(this.kind==='claude'&&S.cuser&&typeof S.cuser.can==='function'){const c=await S.cuser.can('data.write');if(c===false)S.readOnly=true}}catch(e){}
   } else {this.mode='local';this.kind='local';await this.loadLocal()}
 },
 subscribeAll(){
   return Promise.all(COLLS.map(c=>new Promise(res=>{
     let done=false;const fin=()=>{if(!done){done=true;clearTimeout(t);res()}};
     const t=setTimeout(()=>{S.stale=true;fin()},10000);
     try{
       const ref=this.kind==='firebase'&&c==='logs'?this.db.collection(c).orderBy('at','desc').limit(500):this.db.collection(c),on=(h,e)=>this.kind==='firebase'?ref.onSnapshot({includeMetadataChanges:true},h,e):ref.onSnapshot(h,e);
       on(snap=>{   // includeMetadataChanges: also hear the server's confirmation when nothing changed (e.g. an empty new database)

         const m=new Map();snap.docs.forEach(d=>{if(d.exists!==false)m.set(d.id,{...d.data(),id:d.id})});
         S.data[c]=m;const firstServer=!snap.metadata.fromCache&&!S.serverSeen[c];
         if(!snap.metadata.fromCache){S.serverSeen[c]=true;S.stale=false;fin();if(this.kind==='firebase'&&!Store.warm&&COLLS.every(x=>S.serverSeen[x])){Store.warm=true;try{localStorage.setItem('ajuz_fbwarm_'+FIREBASE_CONFIG.projectId,'1')}catch(e){}}}
         else if(this.kind==='firebase'&&(snap.size>0||(Store.warm&&Store.persist&&S.data.users&&S.data.users.size>0)))fin();   // this device already holds a copy: show it now. An empty cache proves nothing, so wait for the server.
         if(S.ready){if(S.user)scheduleRender();else if(firstServer&&(c==='users'||c==='settings')&&S.authScreen==='signin'&&!$('#signinForm input:focus'))renderAuth('signin')}
       },err=>{S.dbError=err&&err.code;if(this.kind==='firebase'&&err&&err.code==='permission-denied')S.fbErr='Firebase refused access to the records. In the Firebase console check that Anonymous sign-in is enabled and that the Firestore rules from SETUP-GUIDE.html are published.';fin();if(S.ready)scheduleRender()});
     }catch(e){fin()}
   })));

   try{
     for(const c of COLLS){
       let a=null;

       else if(this.local==='ls'){const raw=localStorage.getItem('ajuz_'+c);if(raw)a=JSON.parse(raw)}
       if(Array.isArray(a))S.data[c]=new Map(a.map(o=>[o.id,o]));
     }
   }catch(e){}
   if(this.local==='memory')S.noPersist=true;
   try{if(this.local!=='memory'&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
 },
 saveLocal(c){
   if(this.local==='memory')return;
   if(this.local==='idb'){this._q=this._q.then(()=>IDB.set('c_'+c,list(c))).catch(()=>{this.local=lsOK()?'ls':'memory';if(this.local==='ls')COLLS.forEach(k=>this.saveLocal(k));else{S.noPersist=true;scheduleRender()}});return}
   try{localStorage.setItem('ajuz_'+c,JSON.stringify(list(c)))}catch(e){if(!S.saveWarned){S.saveWarned=true;S.storageFull=true;scheduleRender()}}
 },
 async put(c,obj){
   if(S.readOnly)throw new Error('read-only');
   if(!obj.id)obj.id=uid();
   const body=clone(obj);
   const prev=S.data[c].get(obj.id);
   S.data[c].set(obj.id,body);
   if(this.mode==='shared'){
     if(this.kind==='firebase'){
       await this.fbWrite(this.db.collection(c).doc(obj.id).set(body),()=>{if(S.data[c].get(obj.id)===body){if(prev)S.data[c].set(obj.id,prev);else S.data[c].delete(obj.id)}});
     } else {
       try{await this.db.collection(c).doc(obj.id).set(body)}
       catch(e){if(prev)S.data[c].set(obj.id,prev);else S.data[c].delete(obj.id);writeError(e);scheduleRender();throw e}
     }
   } else this.saveLocal(c);
   scheduleRender();return obj.id;
 },
 async del(c,id){
   const prev=S.data[c].get(id);S.data[c].delete(id);
   if(this.mode==='shared'){
     if(this.kind==='firebase')await this.fbWrite(this.db.collection(c).doc(id).delete(),()=>{if(prev&&!S.data[c].has(id))S.data[c].set(id,prev)});
     else{try{await this.db.collection(c).doc(id).delete()}catch(e){if(prev)S.data[c].set(id,prev);writeError(e);scheduleRender();throw e}}
   }
   else this.saveLocal(c);
   scheduleRender();
 },
 /* Firestore applies a write to the device copy at once and uploads it when online; its promise only
    settles when the server answers. Wait briefly so a refusal (e.g. security rules) still stops the form,
    but never leave the user waiting on a slow or missing connection. Bulk jobs do not wait at all. */
 pending:0,
 async fbWrite(promise,undo){
   let err=null;this.pending++;S.unsynced=this.pending;
   const w=promise.then(()=>{},e=>{err=e;try{e._reported=true}catch(x){}undo();writeError(e);scheduleRender()}).finally(()=>{this.pending--;S.unsynced=this.pending;if(!this.pending)renderSync()});
   if(!S.bulk&&navigator.onLine!==false)await Promise.race([w,sleep(1500)]);
   if(err)throw err;
 },
 async putPhoto(id,dataUrl){
   if(this.mode==='shared'){await this.db.collection('photos').doc(id).set({d:dataUrl,t:Date.now()})}
   else if(this.local==='idb'){try{await IDB.set('ph_'+id,dataUrl)}catch(e){this.mem.set(id,dataUrl)}}
   else if(this.local==='ls'){try{localStorage.setItem('ajuz_photo_'+id,dataUrl)}catch(e){this.mem.set(id,dataUrl)}}
   else this.mem.set(id,dataUrl);
 },
 async getPhoto(id){
   try{
     if(this.mode==='shared'){const s=await this.db.collection('photos').doc(id).get();return s.exists?s.data().d:null}
     if(this.mem.has(id))return this.mem.get(id);

 }

async function hashPw(pw,salt){
  const enc=new TextEncoder().encode(salt+'|'+pw);
  try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',enc);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=2166136261;for(const c of enc){h^=c;h=Math.imul(h,16777619)>>>0}return 'f'+h.toString(16);
}

const Modals=[];
function openModal({title,body,foot='',size='',onClose,onOpen}){
  const w=document.createElement('div');w.className='overlay';
  const hid='mh'+uid();
  w.innerHTML=`<div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="${hid}"><header><h2 id="${hid}">${title}</h2><button type="button" class="icon-btn" data-close aria-label="Close">×</button></header><div class="mbody">${body}</div>${foot?`<footer>${foot}</footer>`:''}</div>`;
  document.body.appendChild(w);
  const m={el:w,onClose,prev:document.activeElement};Modals.push(m);
  w.querySelector('[data-close]').addEventListener('click',()=>closeModal(m));
  $$('[data-cancel]',w).forEach(b=>b.addEventListener('click',()=>closeModal(m)));
  w.addEventListener('mousedown',e=>{if(e.target===w)m._down=true});
  w.addEventListener('click',e=>{if(e.target===w&&m._down)closeModal(m);m._down=false});
  onOpen&&onOpen(m);
  setTimeout(()=>{const f=w.querySelector('[autofocus]')||w.querySelector('.mbody input:not([type=hidden]):not([readonly]),.mbody select,.mbody textarea,.mbody button')||w.querySelector('[data-close]');f&&f.focus()},30);
  return m;
}
function closeModal(m){m=m||Modals[Modals.length-1];if(!m)return;const i=Modals.indexOf(m);if(i<0)return;Modals.splice(i,1);m.el.remove();m.onClose&&m.onClose();try{m.prev&&m.prev.isConnected&&m.prev.focus()}catch(e){}}
document.addEventListener('keydown',e=>{
  const m=Modals[Modals.length-1];
  if(e.key==='Escape'){if(m){e.preventDefault();closeModal(m)}else if($('.side.open')){$('.side').classList.remove('open')}return}
  if(e.key==='Tab'&&m){
    const f=$$('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])',m.el).filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
    else if(!m.el.contains(document.activeElement)){e.preventDefault();a.focus()}
  }
});

async function doSignin(e){
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  const u=findUser(f.username||'');
  if(!u||u.hash!==await hashPw(f.pw||'',u.salt))return authErr('Wrong username or password.');
  if(u.status==='pending'){S.authMsg=`<h2>Awaiting approval</h2><p class="sub">Your account for <b>${esc(bname(u.branchId))}</b> has been created. The administrator must approve it before you can sign in.</p>`;return renderAuth('msg')}
  if(u.status!=='active'){S.authMsg=`<h2>Account not active</h2><p class="sub">This account has been suspended. Contact the administrator.</p>`;return renderAuth('msg')}
  if(u.role!=='admin'&&!get('branches',u.branchId))return authErr('Your branch no longer exists. Contact the administrator.');
  S.user=u;sess.set(u.id);await log('Sign in','');if(u.mustChange)return renderAuth('forcepw');startApp();
}
async function doRegister(e){
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  if(!f.name.trim()||!f.phone.trim()||!f.branchId||!f.username.trim())return authErr('Fill in your name, phone, branch and username.');
  if(!/^[A-Za-z0-9._-]{3,30}$/.test(f.username.trim()))return authErr('Username: 3–30 letters, numbers, dot, dash or underscore. No spaces.');
  if(findUser(f.username))return authErr('That username is already taken.');
  if(f.pw.length<6)return authErr('Password must be at least 6 characters.');
  if(f.pw!==f.pw2)return authErr('The passwords do not match.');
  const salt=uid();const need=settings().requireApproval;
  const u={id:'u_'+uid(),role:'accountant',name:f.name.trim(),phone:f.phone.trim(),email:(f.email||'').trim(),branchId:f.branchId,username:f.username.trim(),salt,hash:await hashPw(f.pw,salt),status:need?'pending':'active',createdAt:Date.now()};
  try{await Store.put('users',u)}catch(err){return authErr('Could not create the account.')}
  const prevUser=S.user;S.user=u;await log('Account created',`${u.name} (${bname(u.branchId)})`);S.user=prevUser;
  if(need){S.authMsg=`<h2>Account created</h2><p class="sub">Thank you, ${esc(u.name)}. The administrator will approve your <b>${esc(bname(u.branchId))}</b> account. You can sign in once it is approved.</p>`;renderAuth('msg')}
  else{S.user=u;sess.set(u.id);startApp()}
}

function index(){
  const I={rcBySale:new Map(),rcByOpen:new Map(),payByBill:new Map(),payByOpen:new Map(),payByPur:new Map()};
  for(const r of list('receipts')){if(r.saleId)addTo(I.rcBySale,r.saleId,r.amount);if(r.openingId)addTo(I.rcByOpen,r.openingId,r.amount)}
  for(const p of list('payments')){if(p.payableId)addTo(I.payByBill,p.payableId,p.amount);if(p.openingId)addTo(I.payByOpen,p.openingId,p.amount);if(p.purchaseId)addTo(I.payByPur,p.purchaseId,p.amount)}
  return I;
}
const saleBal=(s,I)=>r2(s.total-(s.paid||0)-(I.rcBySale.get(s.id)||0));
const purBal=(p,I)=>r2(p.total-(I.payByPur.get(p.id)||0));
function receivableItems(I=index(),asOf){
  const out=[],t=asOf||today();
  for(const s of list('sales'))if(inScope(s)&&s.date<=t){const bal=saleBal(s,I);if(bal>0.004)out.push({kind:'sale',id:s.id,date:s.date,branchId:s.branchId,customer:s.customer||'Walk-in customer',phone:s.phone||'',ref:s.invoiceNo,total:s.total,bal,age:Math.max(0,days(s.date,t))})}
  for(const o of list('openings'))if(o.type==='receivable'&&inScope(o)){const bal=r2(o.amount-(I.rcByOpen.get(o.id)||0));if(bal>0.004)out.push({kind:'opening',id:o.id,date:o.asOf,branchId:o.branchId,customer:o.party,phone:o.phone||'',ref:'Opening balance',total:o.amount,bal,age:Math.max(0,days(o.asOf,t))})}
  return out.sort((a,b)=>b.age-a.age);
}
function payableItems(I=index()){
  const out=[];
  for(const p of list('purchases'))if(inScope(p)){const paid=I.payByPur.get(p.id)||0;out.push({kind:'purchase',id:p.id,date:p.date,due:p.due||'',branchId:p.branchId,supplier:p.supplier,desc:`Purchase ${p.ref||''}: ${(p.lines||[]).map(l=>`${num(l.qty)} ${pname(l.productId)}`).join(', ')}`.slice(0,120),ref:p.ref||'',amount:p.total,paid,bal:r2(p.total-paid),rec:p})}
  for(const p of list('payables'))if(inScope(p)){const paid=I.payByBill.get(p.id)||0;out.push({kind:'bill',id:p.id,date:p.date,due:p.due,branchId:p.branchId,supplier:p.supplier,desc:p.description+(p.category?` (${p.category})`:''),ref:p.ref||'',amount:p.amount,paid,bal:r2(p.amount-paid),rec:p})}
  for(const o of list('openings'))if(o.type==='payable'&&inScope(o)){const paid=I.payByOpen.get(o.id)||0;out.push({kind:'opening',id:o.id,date:o.asOf,due:o.due||'',branchId:o.branchId,supplier:o.party,desc:'Opening balance',ref:'',amount:o.amount,paid,bal:r2(o.amount-paid),rec:o})}
  return out.sort(byDateDesc);

/* book stock for one branch, optionally as at a date */
function stockRows(bid,asOf){
  const m=new Map();const ok=d=>!asOf||String(d)<=asOf;
  const row=pid=>{if(!m.has(pid))m.set(pid,{pid,open:0,inn:0,sold:0,tin:0,tout:0,adj:0});return m.get(pid)};
  productsFor(bid).forEach(p=>row(p.id));
  for(const o of list('openings'))if(o.type==='stock'&&o.branchId===bid&&ok(o.asOf))row(o.productId).open+=Number(o.qty)||0;
  for(const p of list('purchases'))if(p.branchId===bid)for(const d of delivs(p))if(ok(d.date))for(const l of d.lines||[])row(l.productId).inn+=Number(l.qty)||0;
  for(const mv of list('moves')){if(!ok(mv.date))continue;
    if(mv.type==='in'&&mv.branchId===bid)row(mv.productId).inn+=Number(mv.qty)||0;
    else if(mv.type==='transfer'){if(mv.branchId===bid)row(mv.productId).tout+=Number(mv.qty)||0;if(mv.toBranch===bid)row(mv.productId).tin+=Number(mv.qty)||0}
    else if(mv.type==='adj'&&mv.branchId===bid)row(mv.productId).adj+=Number(mv.qty)||0;
    else if(mv.type==='out'&&mv.branchId===bid)row(mv.productId).adj-=Number(mv.qty)||0;
  }
  for(const s of list('sales'))if(s.branchId===bid&&ok(s.date))for(const it of s.items||[])if(it.productId)row(it.productId).sold+=Number(it.qty)||0;
  const counts=list('counts').filter(c=>c.branchId===bid&&ok(c.date)).sort(byDateDesc);
  const cm=costMap(asOf);
  return [...m.values()].map(r=>{
    r.book=r2(r.open+r.inn+r.tin-r.tout-r.sold+r.adj);
    for(const c of counts){const l=(c.lines||[]).find(x=>x.productId===r.pid);if(l){r.count={date:c.date,qty:l.qty,book:l.book,method:l.method,countId:c.id};break}}
    r.p=get('products',r.pid)||{name:pname(r.pid)};r.cost=cm.get(r.pid)||0;r.value=r2(Math.max(0,r.book)*r.cost);
    return r;
  }).sort((a,b)=>prodSort(a.p,b.p));
}
function bookQty(bid,pid,asOf){const r=stockRows(bid,asOf).find(x=>x.pid===pid);return r?r.book:0}
/* unit cost: cost price set in Products, else latest purchase cost on or before the date */
function costMap(asOf){
  const m=new Map(),d=new Map();
  const consider=(pid,cost,date)=>{if(!(cost>0))return;if(asOf&&String(date)>asOf)return;if(!d.has(pid)||String(date)>=d.get(pid)){d.set(pid,String(date));m.set(pid,cost)}};
  for(const o of list('openings'))if(o.type==='stock')consider(o.productId,Number(o.unitCost),o.asOf);
  for(const mv of list('moves'))if(mv.type==='in')consider(mv.productId,Number(mv.unitCost),mv.date);
  for(const p of list('purchases'))for(const d of delivs(p))for(const l of d.lines||[])consider(l.productId,lineCost(p,l.productId),d.date);
  for(const p of list('products'))if(Number(p.cost)>0)m.set(p.id,Number(p.cost));
  return m;
}
function scopedBranchIds(){const b=scopeBranch();return b==='all'?branches().map(x=>x.id):[b]}
/* cash and bank position of a branch at the end of a date */
function cashPos(bid,d){
  const ok=x=>String(x)<=d;const z={open:0,openBank:0,sales:0,coll:0,paid:0,dep:0,wd:0,extra:0,red:0,bankIn:0,bankOut:0};
  for(const o of list('openings'))if(o.branchId===bid&&ok(o.asOf)){if(o.type==='cash')z.open+=Number(o.amount)||0;if(o.type==='bank')z.openBank+=Number(o.amount)||0}
  for(const s of list('sales'))if(s.branchId===bid&&ok(s.date)){const a=Number(s.paid)||0;if(s.method==='Cash')z.sales+=a;else z.bankIn+=a}
  for(const r of list('receipts'))if(r.branchId===bid&&ok(r.date)){const a=Number(r.amount)||0;if(r.method==='Cash')z.coll+=a;else z.bankIn+=a}
  for(const p of list('payments'))if(p.branchId===bid&&ok(p.date)){const a=Number(p.amount)||0;if(p.method==='Cash')z.paid+=a;else z.bankOut+=a}
  for(const c of list('cashmoves'))if(c.branchId===bid&&ok(c.date)){const a=Number(c.amount)||0;if(c.type==='lodge')z.dep+=a;else if(c.type==='withdraw')z.wd+=a;else if(c.type==='cashin')z.extra+=a;else if(c.type==='cashout')z.red+=a}
  for(const k in z)z[k]=r2(z[k]);
  z.cash=r2(z.open+z.sales+z.coll-z.paid-z.dep+z.wd+z.extra-z.red);
  z.bank=r2(z.openBank+z.bankIn-z.bankOut+z.dep-z.wd);
  return z;
}
/* profit or loss for one branch and a period */
function pnl(bid,from,to){
  const inP=d=>String(d)>=from&&String(d)<=to;
  const prev=addDays(from,-1);
  const cmPrev=costMap(prev),cmTo=costMap(to);
  const sales=list('sales').filter(s=>s.branchId===bid&&inP(s.date));
  const revenue=r2(sum(sales,'total'));
  const gross=r2(sum(sales,'subtotal')||sum(sales,s=>sum(s.items||[],i=>i.qty*i.price)));
  const discount=r2(sum(sales,s=>s.discount||0));
  const openInv=r2(sum(stockRows(bid,prev),r=>Math.max(0,r.book)*(cmPrev.get(r.pid)||r.cost||0))+sum(list('openings').filter(o=>o.type==='stock'&&o.branchId===bid&&inP(o.asOf)),o=>o.qty*(Number(o.unitCost)||cmTo.get(o.productId)||0)));
  let purchases=0;for(const p of list('purchases'))if(p.branchId===bid)for(const d of delivs(p))if(inP(d.date))purchases+=sum(d.lines||[],l=>(Number(l.qty)||0)*lineCost(p,l.productId));
  for(const mv of list('moves'))if(mv.type==='in'&&mv.branchId===bid&&inP(mv.date))purchases+=(Number(mv.qty)||0)*(Number(mv.unitCost)||cmTo.get(mv.productId)||0);
  let tin=0,tout=0;for(const mv of list('moves'))if(mv.type==='transfer'&&inP(mv.date)){const v=(Number(mv.qty)||0)*(cmTo.get(mv.productId)||0);if(mv.toBranch===bid)tin+=v;if(mv.branchId===bid)tout+=v}
  const closeInv=r2(sum(stockRows(bid,to),r=>r.value));
  const cogs=r2(openInv+purchases+tin-tout-closeInv);
  const gp=r2(revenue-cogs);
  const exp=new Map();
  for(const p of list('payments'))if(p.branchId===bid&&inP(p.date)&&isExpense(p)&&!p.payableId)addTo(exp,p.category||'Other',p.amount);
  for(const b of list('payables'))if(b.branchId===bid&&inP(b.date))addTo(exp,b.category||'Other',b.amount);
  const totalExp=r2(sum([...exp.values()],x=>x));
  return {revenue,gross,discount,openInv,purchases:r2(purchases),tin:r2(tin),tout:r2(tout),closeInv,cogs,gp,exp,totalExp,net:r2(gp-totalExp),salesCount:sales.length};
}

const COLL_LABEL={sales:'Sale',receipts:'Customer payment',purchases:'Purchase',payables:'Credit bill',payments:'Payment',moves:'Stock movement',counts:'Stock count',openings:'Opening balance',cashmoves:'Cash movement',cashcounts:'Cash count'};
function describe(c,r){
  if(!r)return '';

    case 'sales':return `${r.invoiceNo} · ${fdate(r.date)} · ${r.customer||'Walk-in'} · ${(r.items||[]).map(i=>`${num(i.qty)} ${iname(i)} @ ${money0(i.price)}`).join(', ')} · total ${money(r.total)}, paid ${money(r.paid)} (${r.method})`;
    case 'purchases':return `Order ${fdate(r.date)} · ${r.supplier} ${r.ref||''} · ${purItems(r).map(i=>`${pname(i.pid)}: ordered ${num(i.ordered)} @ ${money0(i.cost)}, delivered ${num(i.delivered)}, pending ${num(i.pending)}`).join('; ')} · total ${money(r.total)}`;
    case 'receipts':return `${fdate(r.date)} · ${r.customer} · ${money(r.amount)} (${r.method}) for ${r.ref}`;
    case 'payments':return `${fdate(r.date)} · ${r.payee} · ${r.category} · ${money(r.amount)} (${r.method})${r.description?' · '+r.description:''}`;
    case 'payables':return `${fdate(r.date)} · ${r.supplier} · ${r.description} · ${money(r.amount)}`;
    case 'moves':return `${fdate(r.date)} · ${({transfer:'Transfer',out:'Write-off',adj:'Adjustment',in:'Received'})[r.type]||r.type} · ${num(r.qty)} ${pname(r.productId)}${r.toBranch?' → '+bname(r.toBranch):''}${r.note?' · '+r.note:''}`;
    case 'counts':return `${fdate(r.date)} · ${(r.lines||[]).map(l=>`${pname(l.productId)}: ${num(l.qty)}`).join(', ')}`;
    case 'openings':return `${r.type} · ${fdate(r.asOf)} · ${r.productId?`${num(r.qty)} ${pname(r.productId)}`:(r.party||'')} ${r.amount?money(r.amount):''}`;
    case 'cashmoves':return `${fdate(r.date)} · ${({lodge:'Cash lodged to bank',withdraw:'Bank withdrawal to cash',cashin:'Other cash in',cashout:'Other cash out'})[r.type]} · ${money(r.amount)}`;
    case 'cashcounts':return `${fdate(r.date)} · physical cash ${money(r.amount)}`;
  }
  return '';
}
async function commit(coll,rec,before){
  if(!before){await Store.put(coll,rec);await log('Added '+(COLL_LABEL[coll]||coll),describe(coll,rec));return 'saved'}
  if(isAdmin()){await Store.put(coll,rec);await log('Edited '+(COLL_LABEL[coll]||coll),describe(coll,rec));return 'saved'}
  if(pendingFor(before.id)){toast('A change for this record is already waiting for the admin.',true);return 'dup'}
  const reason=await askText('Reason for the change','Why does this record need to change? The admin will see this.','Send for approval');
  if(!reason)return 'cancel';
  await Store.put('requests',{type:'edit',coll,recId:before.id,before,after:rec,reason,branchId:before.branchId||S.user.branchId,by:S.user.id,status:'pending',createdAt:Date.now()});
  await log('Edit requested',`${COLL_LABEL[coll]}: ${describe(coll,before)}`);toast('Sent to the admin for approval');return 'requested';
}
async function requestDelete(coll,id){
  const r=get(coll,id);if(!r)return;
  if(coll==='openings'&&r.type==='stock'&&!stockOpeningGuard())return;
  if(isAdmin()){
    if(!await ask(`Delete this ${(COLL_LABEL[coll]||'record').toLowerCase()}?<br><span class="kbd">${esc(describe(coll,r))}</span>${cascadeNote(coll,r)}`,'Delete',true))return;
    await runDelete(coll,r);toast('Deleted');return;
  }
  if(pendingFor(id))return toast('A change for this record is already waiting for the admin.',true);
  const reason=await askText('Ask the admin to delete','Why should this record be deleted?','Send for approval');
  if(!reason)return;
  await Store.put('requests',{type:'delete',coll,recId:id,before:r,reason,branchId:r.branchId||S.user.branchId,by:S.user.id,status:'pending',createdAt:Date.now()});
  await log('Delete requested',`${COLL_LABEL[coll]}: ${describe(coll,r)}`);toast('Sent to the admin for approval');
}
function cascadeNote(coll,r){

async function runDelete(coll,r){

  if(coll==='purchases')for(const x of list('payments').filter(x=>x.purchaseId===r.id))await Store.del('payments',x.id);
  if(coll==='counts')for(const x of list('moves').filter(x=>x.countId===r.id))await Store.del('moves',x.id);
  if(coll==='payables')for(const x of list('payments').filter(x=>x.payableId===r.id))await Store.put('payments',{...x,payableId:'',description:(x.description||'')+' (bill deleted)'});
  if(coll==='openings'){for(const x of list('receipts').filter(x=>x.openingId===r.id))await Store.put('receipts',{...x,openingId:''});for(const x of list('payments').filter(x=>x.openingId===r.id))await Store.put('payments',{...x,openingId:''})}
  await Store.del(coll,r.id);await log('Deleted '+(COLL_LABEL[coll]||coll),describe(coll,r));
}

function cashTable(d){

  const T=k=>sum(rows,k),m=money;
  return {rows,html:`<div class="tw"><table><thead><tr><th>Branch</th><th class="n">Opening cash</th><th class="n">+ Cash sales</th><th class="n">+ Cash collected</th><th class="n">+ Extra cash</th><th class="n">− Cash paid out</th><th class="n">− Cash reductions</th><th class="n">− Deposited to bank</th><th class="n">= Cash balance</th><th class="n">Bank balance</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${esc(r.b.name)}</b></td><td class="n">${m(r.open)}</td><td class="n">${m(r.sales)}</td><td class="n">${m(r.coll)}</td><td class="n">${m(r.extra+r.wd)}</td><td class="n">${m(r.paid)}</td><td class="n">${m(r.red)}</td><td class="n">${m(r.dep)}</td><td class="n"><b class="${r.cash<0?'neg':''}">${m(r.cash)}</b></td><td class="n">${m(r.bank)}</td></tr>`).join('')||'<tr><td colspan="10" class="empty">No branches.</td></tr>'}</tbody>
  ${rows.length>1?`<tfoot><tr><td>Total</td><td class="n">${m(T('open'))}</td><td class="n">${m(T('sales'))}</td><td class="n">${m(T('coll'))}</td><td class="n">${m(T('extra')+T('wd'))}</td><td class="n">${m(T('paid'))}</td><td class="n">${m(T('red'))}</td><td class="n">${m(T('dep'))}</td><td class="n">${m(T('cash'))}</td><td class="n">${m(T('bank'))}</td></tr></tfoot>`:''}</table></div>`};
}

/* ---------- CEO statement (opened on demand, branch by branch) ---------- */
function ceoCard(){
  const c=S.f.ceo||{};
  if(!c.open)return `<section class="card" style="margin-bottom:14px"><div class="card-h"><span aria-hidden="true" style="font-size:20px">📋</span><h3>CEO statement</h3><span class="kbd">A summary of everything that happened in each branch</span><div class="spacer"></div><button class="btn dark" data-act="ceoOpen">Show CEO statement</button></div></section>`;
  const from=c.from||monthStart(),to=c.to||today();
  return `<section class="card statement" style="margin-bottom:14px"><div class="card-h"><span aria-hidden="true" style="font-size:20px">📋</span><h3>CEO statement</h3><div class="spacer"></div>${c.shown?ioBtns('ceo'):''}<button class="btn sm" data-act="ceoClose">Hide</button></div>
   <div class="pad"><div class="row" style="align-items:flex-end"><label class="f">From<input class="in" type="date" id="ceoFrom" value="${esc(from)}" max="${today()}"></label><label class="f">To<input class="in" type="date" id="ceoTo" value="${esc(to)}" max="${today()}"></label><label class="f">Branch<select class="in" id="ceoBr"><option value="all">All branches, one by one</option>${branches().map(b=>`<option value="${b.id}" ${c.br===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label><button class="btn primary" data-act="ceoGo">Show statement</button></div>
   ${c.shown?`<div style="margin-top:6px">${ceoStatement(from,to,c.br||'all')}</div>`:'<p class="kbd" style="margin:12px 0 0">Choose the dates (and a branch if you want just one), then press Show statement.</p>'}</div></section>`;
}
function ceoStatement(from,to,br){
  const I=index(),cost=showCost();
  let bs=branches().filter(b=>scopedBranchIds().includes(b.id));if(br&&br!=='all')bs=bs.filter(b=>b.id===br);
  const per=bs.map(b=>{
    const p=pnl(b.id,from,to);
    const sales=list('sales').filter(s=>s.branchId===b.id&&s.date>=from&&s.date<=to);
    const rc=list('receipts').filter(r=>r.branchId===b.id&&r.date>=from&&r.date<=to);
    const coll=r2(sum(sales,'paid')+sum(rc,'amount'));
    const stc={Paid:0,'Partially paid':0,Unpaid:0};sales.forEach(s=>stc[saleStatus(s,I)]++);
    const tp=new Map();for(const s of sales)for(const it of s.items||[]){const k=it.productId||'name:'+it.name;const o=tp.get(k)||{q:0,v:0,it};o.q+=Number(it.qty)||0;o.v+=it.qty*it.price;tp.set(k,o)}
    const top=[...tp.entries()].sort((a,c)=>c[1].v-a[1].v)[0];
    const recv=list('sales').filter(s=>s.branchId===b.id&&s.date<=to).map(s=>({bal:saleBal(s,I),age:days(s.date,to)})).concat(list('openings').filter(o=>o.type==='receivable'&&o.branchId===b.id).map(o=>({bal:r2(o.amount-(I.rcByOpen.get(o.id)||0)),age:days(o.asOf,to)}))).filter(x=>x.bal>0.004);
    const owe=sum(recv,'bal'),old=sum(recv.filter(x=>x.age>60),'bal');
    const sup=sum(payableItems(I).filter(x=>x.branchId===b.id&&x.bal>0.004),'bal');
    const pend=list('purchases').filter(x=>x.branchId===b.id).flatMap(x=>purItems(x).filter(i=>i.pending>0).map(i=>({...i,p:x})));
    const topExp=[...p.exp.entries()].sort((a,c)=>c[1]-a[1])[0];
    const cp=cashPos(b.id,to);
    const cnt=list('counts').filter(c=>c.branchId===b.id&&c.date>=from&&c.date<=to);
    const short=cnt.flatMap(c=>c.lines||[]).filter(l=>l.qty<l.book).sort((a,c)=>(a.qty-a.book)-(c.qty-c.book))[0];
    const low=stockRows(b.id,to).filter(r=>(Number(r.p.reorder)||0)>0&&r.book<=r.p.reorder).map(r=>r.p.name);
    const tiles=[['Sales',money0(p.revenue),`${sales.length} invoice(s)`],['Money collected',money0(coll),'cash, transfer & POS'],['Stock received',money0(p.purchases),pend.length?`${pend.length} item(s) still pending`:'nothing pending'],['Expenses',money0(p.totalExp),topExp?`largest: ${topExp[0]}`:'none']];
    if(cost)tiles.push(['Gross profit',money0(p.gp),p.revenue?`${Math.round(p.gp/p.revenue*100)}% of sales`:''],[p.net<0?'Net loss':'Net profit',money0(Math.abs(p.net)),'after expenses']);
    tiles.push(['Customers owe',money0(owe),old?`${money0(old)} over 60 days`:'all recent'],['We owe suppliers',money0(sup),''],['Cash in hand',money0(cp.cash),'as at '+fdate(to)],['Bank',money0(cp.bank),'as at '+fdate(to)]);
    const t=[];
    t.push(sales.length?`${esc(b.name)} sold <b>${money0(p.revenue)}</b> on ${sales.length} invoice${sales.length>1?'s':''}: ${stc.Paid} fully paid, ${stc['Partially paid']} partly paid and ${stc.Unpaid} unpaid${top?`. The best seller was ${esc(iname(top[1].it))} (${num(top[1].q)}${top[1].it.productId?' '+esc(punit(top[0])):''}, ${money0(top[1].v)})`:''}.`:`${esc(b.name)} recorded no sales in this period.`);
    t.push(`It collected ${money0(coll)} from customers.`);
    if(cost)t.push(`Gross profit was ${money0(p.gp)}; after expenses of ${money0(p.totalExp)} the branch made a <b class="${p.net<0?'neg':'pos'}">net ${p.net<0?'loss':'profit'} of ${money0(Math.abs(p.net))}</b>.`);
    else t.push(`Expenses came to ${money0(p.totalExp)}.`);
    t.push(p.purchases?`Stock worth ${money0(p.purchases)} was received.`:'No stock was received.');
    if(pend.length)t.push(`Still awaiting delivery: ${pend.slice(0,4).map(i=>`${num(i.pending)} ${esc(punit(i.pid))} of ${esc(pname(i.pid))} from ${esc(i.p.supplier)}`).join('; ')}${pend.length>4?` and ${pend.length-4} more`:''}.`);
    t.push(owe?`Customers owe ${money0(owe)}${old?`, of which ${money0(old)} is over 60 days old`:''}.`:'No customer owes this branch.');
    if(sup)t.push(`The branch owes suppliers ${money0(sup)}.`);
    t.push(`Cash in hand is ${money0(cp.cash)} and bank ${money0(cp.bank)} as at ${fdate(to)}.`);
    t.push(cnt.length?`${cnt.length} stock count${cnt.length>1?'s were':' was'} done${short?`; the largest shortage was ${esc(pname(short.productId))} (${num(r2(short.qty-short.book))} ${esc(punit(short.productId))})`:' with no shortages'}.`:'No stock count was done.');
    if(low.length)t.push(`Running low: ${low.map(esc).join(', ')}.`);
    return {b,p,coll,owe,cash:cp.cash,html:`<div class="ceo-br"><h4>${esc(b.name)}</h4><div class="ceo-grid">${tiles.map(x=>`<div><span>${x[0]}</span><b class="${x[0]==='Net loss'?'neg':''}">${x[1]}</b><small>${esc(x[2])}</small></div>`).join('')}</div><p>${t.join(' ')}</p></div>`};
  });
  let h=`<p class="ceo-period">Period: <b>${fdate(from)}</b> to <b>${fdate(to)}</b></p>`;
  if(per.length>1){
    const best=[...per].sort((a,c)=>c.p.revenue-a.p.revenue)[0];const net=sum(per,x=>x.p.net);
    const pu=pendingUsers().length,pr=pendingReqs().length;
    h+=`<p><b>Overview.</b> The business sold <b>${money0(sum(per,x=>x.p.revenue))}</b>${best.p.revenue?`, led by ${esc(best.b.name)} (${money0(best.p.revenue)})`:''}${cost?`, and made a <b class="${net<0?'neg':'pos'}">net ${net<0?'loss':'profit'} of ${money0(Math.abs(net))}</b>`:''}. Customers owe ${money0(sum(per,'owe'))} in total, and the branches hold ${money0(sum(per,'cash'))} cash in hand.${pu||pr?` Waiting for your approval: ${pu?`${pu} new account${pu>1?'s':''}`:''}${pu&&pr?' and ':''}${pr?`${pr} change request${pr>1?'s':''}`:''}.`:''}</p>`;
  }
  return h+per.map(x=>x.html).join('');
}

function saleStatus(s,I){const b=saleBal(s,I||index());if(b<=0.004)return 'Paid';if(s.total-b<=0.004)return 'Unpaid';return 'Partially paid'}
const statusPill=st=>`<span class="pill ${st==='Paid'?'ok':st==='Unpaid'?'bad':'warn'}">${st}</span>`;

/* ---------- Purchases: orders, deliveries and pending quantities ---------- */
const delivs=p=>Array.isArray(p.deliveries)?p.deliveries:[{id:'d0',date:p.date,lines:(p.lines||[]).map(l=>({productId:l.productId,qty:Number(l.qty)||0}))}];
const lineCost=(p,pid)=>{const l=(p.lines||[]).find(x=>x.productId===pid);return l?Number(l.cost)||0:0};
function purItems(p){const ds=delivs(p);return (p.lines||[]).map(l=>{const del=r2(sum(ds,d=>sum((d.lines||[]).filter(x=>x.productId===l.productId),'qty')));const o=Number(l.qty)||0;return {pid:l.productId,ordered:o,cost:Number(l.cost)||0,delivered:del,pending:r2(Math.max(0,o-del))}})}
function purStatus(p){const it=purItems(p);if(sum(it,'pending')<=0.0001)return 'Delivered';if(sum(it,'delivered')<=0)return 'Not delivered';return 'Part delivered'}
const purPill=s=>`<span class="pill ${s==='Delivered'?'ok':s==='Not delivered'?'bad':'warn'}">${s}</span>`;
const lastDelivery=p=>delivs(p).map(d=>d.date).sort().pop()||'';
function pendingDeliveries(){return list('purchases').filter(inScope).flatMap(p=>purItems(p).filter(i=>i.pending>0).map(i=>({...i,p}))).sort((a,b)=>String(a.p.date).localeCompare(b.p.date))}
SPEC.purchases=()=>{
  const I=index(),q=F('purchases','q').toLowerCase(),st=F('purchases','st');

  const cols=[{h:'Order date',t:p=>fdate(p.date)},{h:'Supplier',t:p=>`${p.supplier} ${p.ref||''}`.trim(),v:p=>`<b>${esc(p.supplier)}</b><div class="sub">${esc(p.ref||'')}</div>${pendPill(p)}`}];
  if(showBranchCol())cols.push({h:'Branch',t:p=>bname(p.branchId)});
  cols.push({h:'Ordered · delivered · pending',t:p=>purItems(p).map(i=>`${pname(i.pid)}: ordered ${num(i.ordered)}, delivered ${num(i.delivered)}, pending ${num(i.pending)}`).join('; '),
     v:p=>purItems(p).map(i=>`<div class="pi"><b>${esc(pname(i.pid))}</b><span>Ordered <b>${num(i.ordered)}</b></span><span>Delivered <b>${num(i.delivered)}</b></span><span class="${i.pending>0?'neg':'pos'}">Pending <b>${num(i.pending)}</b></span></div>`).join('')},

  return {title:`Purchases — ${scopeLabel()} — ${rangeLabel('purchases')}`,cols,rows,empty:'No purchase orders recorded.',

  const bills=list('payables').map(b=>({...b,payee:b.supplier,_c:'payables',category:b.category||'Other',_status:'On credit',method:'—'}));

  const cols=[{h:'Date',t:r=>fdate(r.date)},{h:'Paid to',t:r=>r.payee,v:r=>`<b>${esc(r.payee)}</b>${pendPill(r)}`},{h:'Category',t:r=>r.category},{h:'Description',t:r=>r.description||''}];

    const cols=[{h:'Item',t:r=>r.p.name,v:r=>`<b>${esc(r.p.name)}</b><div class="sub">${esc(r.p.category)} · per ${esc(r.p.unit)}</div>`},...bs.map((b,i)=>({h:esc(b.name),n:1,t:r=>r.qs[i]==null?'—':num(r.qs[i]),cls:r=>r.qs[i]<0?'neg':''})),{h:'Total',n:1,t:r=>num(r.tot),v:r=>`<b>${num(r.tot)}</b>`}];

   {h:'Opening',n:1,t:r=>num(r.open)},{h:'Purchased',n:1,t:r=>num(r.inn)},{h:'Transfers',n:1,t:r=>(r.tin-r.tout>0?'+':'')+num(r.tin-r.tout)},{h:'Sold',n:1,t:r=>num(r.sold)},{h:'Adj.',n:1,t:r=>num(r.adj)},

  return {title:`Closing inventory — ${bname(sb)} — as at ${fdate(asOf)}`,cols,rows,foot:cost?['Total closing inventory',...Array(cols.length-2).fill(''),money0(sum(rows,'value'))]:null,

function pnlData(){
  const from=F('reports','from',monthStart()),to=F('reports','to',today());
  const bids=scopedBranchIds(),bs=branches().filter(b=>bids.includes(b.id));
  const P=bs.map(b=>pnl(b.id,from,to));
  const cats=[...new Set(P.flatMap(p=>[...p.exp.keys()]))].sort();
  return {from,to,bs,P,cats};

function pnlTable(plain){
  const {from,to,bs,P,cats}=pnlData();const multi=bs.length>1;
  const tot=k=>sum(P,k);
  const cell=v=>`<td class="n">${v<0?`(${money(-v)})`:money(v)}</td>`;
  const row=(label,f,cls='')=>`<tr class="${cls}"><td class="${cls==='ind'?'ind':''}">${label}</td>${multi?P.map(p=>cell(f(p))).join(''):''}${cell(multi?sum(P,f):f(P[0]||{exp:new Map()}))}</tr>`;
  const head=`<tr><th>For the period ${fdate(from)} to ${fdate(to)}</th>${multi?bs.map(b=>`<th class="n">${esc(b.name)}</th>`).join(''):''}<th class="n">${multi?'Total':'₦'}</th></tr>`;
  if(!P.length)return '<p>No branches.</p>';
  const body=[
    row('Revenue (sales, net of discounts)',p=>p.revenue,'sub'),
    row('Opening inventory',p=>p.openInv,'ind'),
    row('Add: purchases',p=>p.purchases,'ind'),
    ...(multi||P.some(p=>p.tin||p.tout)?[row('Add/(less): transfers between branches',p=>p.tin-p.tout,'ind')]:[]),
    row('Less: closing inventory',p=>-p.closeInv,'ind'),
    row('Cost of sales',p=>p.cogs,'sub'),
    row('<b>Gross profit</b>',p=>p.gp,'tot'),
    `<tr><td colspan="${(multi?bs.length:0)+2}"><b>Less: operating expenses</b></td></tr>`,
    ...cats.map(c=>row(esc(c),p=>p.exp.get(c)||0,'ind')),
    row('Total expenses',p=>p.totalExp,'sub'),
    row(`<b>Net profit / (loss)</b>`,p=>p.net,'tot')
  ].join('');
  return `<div class="tw"><table class="${plain?'':'pl'}"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
SPEC.cashbook=()=>{
  const L={lodge:'Cash deposited to bank',withdraw:'Cash withdrawn from bank',cashin:'Extra cash added',cashout:'Cash reduction'};
  const rows=list('cashmoves').filter(r=>inScope(r)&&r.date>=F('reports','from',monthStart())&&r.date<=F('reports','to',today())).sort(byDateDesc);
  const cols=[{h:'Date',t:r=>fdate(r.date)}];if(showBranchCol())cols.push({h:'Branch',t:r=>bname(r.branchId)});
  cols.push({h:'Entry',t:r=>L[r.type]||r.type,v:r=>`<span class="pill ${r.type==='cashin'||r.type==='withdraw'?'ok':r.type==='lodge'?'info':'warn'}">${L[r.type]||r.type}</span>${pendPill(r)}`},{h:'Reason / reference',t:r=>r.ref||r.note||''},{h:'By',t:r=>userName(r.by)},{h:'Amount',n:1,t:r=>money(r.amount),csv:r=>r.amount});
  return {title:`Cash entries — ${scopeLabel()} — ${fdate(F('reports','from',monthStart()))} to ${fdate(F('reports','to',today()))}`,cols,rows,empty:'No extra cash, reductions or deposits recorded in this period.',actions:r=>editBtns('cashmoves',r,'editCashMove')};
};

async function makePdf(title,body,o={}){
  await loadPdfLibs();
  if(!$('#pdfCss')){const st=document.createElement('style');st.id='pdfCss';st.textContent=PDF_CSS;document.head.appendChild(st)}
  const landscape=!!o.landscape,pxW=o.receipt?300:(landscape?1100:760);
  const wrap=document.createElement('div');wrap.className='pdfdoc'+(o.receipt?' rc':'');wrap.style.cssText=`position:fixed;left:-20000px;top:0;width:${pxW}px;background:#fff;z-index:-1`;

  try{
    const sc=2,canvas=await window.html2canvas(wrap,{scale:sc,backgroundColor:'#ffffff',logging:false,useCORS:true,windowWidth:pxW+40});
    const {jsPDF}=window.jspdf;const H=wrap.scrollHeight;
    if(o.receipt){const wmm=80,k=wmm/pxW,hmm=Math.max(80,H*k+2);const pdf=new jsPDF({unit:'mm',format:[wmm,hmm],orientation:'portrait'});pdf.addImage(canvas.toDataURL('image/jpeg',.95),'JPEG',0,0,wmm,H*k);if(wm)pdfWatermark(pdf,wm,wmm,hmm);return pdf.output('blob')}

    while(y<H-1){let end=Math.min(H,y+pagePx);if(end<H){const c=cuts.filter(b=>b>y+pagePx*.4&&b<=end).pop();if(c)end=c}
      const sl=document.createElement('canvas');sl.width=canvas.width;sl.height=Math.ceil((end-y)*sc);sl.getContext('2d').drawImage(canvas,0,Math.floor(y*sc),canvas.width,sl.height,0,0,canvas.width,sl.height);

/* a crisp, see-through word across the page (vector text, so it stays sharp at any zoom) */
function pdfWatermark(pdf,text,pw,ph){
  const ang=Math.atan2(ph,pw)*180/Math.PI,diag=Math.hypot(pw,ph);pdf.saveGraphicsState();

  pdf.text(text,pw/2-w/2*Math.cos(a)+hh*Math.sin(a),ph/2+w/2*Math.sin(a)+hh*Math.cos(a),{angle:ang});
  pdf.restoreGraphicsState();pdf.setTextColor(0)}

/* turn paper-white into transparent, crop to the ink, keep it small */
function cleanSig(src,W,H){const c=document.createElement('canvas');const sc=Math.min(1,700/Math.max(W,H));c.width=Math.max(1,Math.round(W*sc));c.height=Math.max(1,Math.round(H*sc));const x=c.getContext('2d');x.drawImage(src,0,0,c.width,c.height);

  let x0=c.width,y0=c.height,x1=0,y1=0;
  for(let i=0,j=0;i<p.length;i+=4,j++){const l=p[i]*.3+p[i+1]*.59+p[i+2]*.11;if(l>cut||p[i+3]<20){p[i+3]=0}else{const k=Math.max(0,Math.min(1,(cut-l)/60));p[i]=p[i+1]=Math.round(20*(1-k));p[i+2]=Math.round(60*(1-k)+40*k);p[i+3]=Math.round(255*Math.max(.35,k));const xx=j%c.width,yy=(j-xx)/c.width;if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}}
  if(x1<=x0||y1<=y0)return '';x.putImageData(d,0,0);const pad=6;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(c.width-1,x1+pad);y1=Math.min(c.height-1,y1+pad);
  const o=document.createElement('canvas');const s2=Math.min(1,420/(x1-x0+1),150/(y1-y0+1));o.width=Math.round((x1-x0+1)*s2);o.height=Math.round((y1-y0+1)*s2);o.getContext('2d').drawImage(c,x0,y0,x1-x0+1,y1-y0+1,0,0,o.width,o.height);return o.toDataURL('image/png')}

ACT.rcptPr=id=>{const rs=receiptGroup(id);if(rs.length)printDoc(`Payment receipt`,`<div class="receipt"><h2>Payment receipt</h2>${payReceiptHtml(rs)}</div>`,{receipt:true})};

/* =========================================================
   CUSTOMER & SUPPLIER ACCOUNTS
   Old balances from before the app (opening balances) and everything since
   (sales, purchases, bills, payments) are joined into ONE account per person
   per branch. A payment is applied to the OLDEST debt first.
   ========================================================= */
const normName=s=>String(s||'').toLowerCase().replace(/[.,'’]/g,' ').replace(/\s+/g,' ').trim();
const isWalkIn=n=>!n||/^walk ?-?in/.test(n);
function custAccounts(){
  const I=index(),acc=new Map();
  const A=(b,name,phone)=>{const k=b+'|'+normName(name);let a=acc.get(k);if(!a){a={key:k,branchId:b,name:String(name).trim(),phone:phone||'',old:0,sales:0,paid:0,bal:0,items:[],last:''};acc.set(k,a)}if(phone&&!a.phone)a.phone=phone;return a};
  for(const o of list('openings'))if(o.type==='receivable'&&inScope(o)){const a=A(o.branchId,o.party,o.phone);const p=I.rcByOpen.get(o.id)||0,bal=r2(o.amount-p);a.old+=o.amount;a.paid+=p;a.bal+=bal;if(o.asOf>a.last)a.last=o.asOf;if(bal>0.004)a.items.push({kind:'opening',id:o.id,date:o.asOf,ref:'Old balance (before the app)',bal,total:o.amount,branchId:o.branchId})}
  for(const s of list('sales'))if(inScope(s)){const n=normName(s.customer);if(isWalkIn(n))continue;const a=A(s.branchId,s.customer,s.phone);
    const rc=I.rcBySale.get(s.id)||0,bal=saleBal(s,I);a.sales+=s.total;a.paid+=(s.paid||0)+rc;a.bal+=bal;if(s.date>a.last)a.last=s.date;if(bal>0.004)a.items.push({kind:'sale',id:s.id,date:s.date,ref:'Invoice '+s.invoiceNo,bal,total:s.total,branchId:s.branchId})}
  for(const a of acc.values()){a.old=r2(a.old);a.sales=r2(a.sales);a.paid=r2(a.paid);a.bal=r2(a.bal);a.items.sort(oldestFirst)}
  return [...acc.values()].sort((x,y)=>y.bal-x.bal||x.name.localeCompare(y.name));
}
function supAccounts(){
  const I=index(),acc=new Map();
  const A=(b,name)=>{const k=b+'|'+normName(name);let a=acc.get(k);if(!a){a={key:k,branchId:b,name:String(name).trim(),old:0,bought:0,paid:0,bal:0,items:[],last:''};acc.set(k,a)}return a};
  for(const o of list('openings'))if(o.type==='payable'&&inScope(o)){const a=A(o.branchId,o.party);const p=I.payByOpen.get(o.id)||0,bal=r2(o.amount-p);a.old+=o.amount;a.paid+=p;a.bal+=bal;if(o.asOf>a.last)a.last=o.asOf;if(bal>0.004)a.items.push({kind:'opening',id:o.id,date:o.asOf,ref:'Old balance (before the app)',bal,total:o.amount,branchId:o.branchId})}
  for(const p of list('purchases'))if(inScope(p)&&p.supplier){const a=A(p.branchId,p.supplier);const pd=I.payByPur.get(p.id)||0,bal=purBal(p,I);a.bought+=p.total;a.paid+=pd;a.bal+=bal;if(p.date>a.last)a.last=p.date;if(bal>0.004)a.items.push({kind:'purchase',id:p.id,date:p.date,ref:'Purchase '+(p.ref||''),bal,total:p.total,branchId:p.branchId})}
  for(const b of list('payables'))if(inScope(b)&&b.supplier){const a=A(b.branchId,b.supplier);const pd=I.payByBill.get(b.id)||0,bal=r2(b.amount-pd);a.bought+=b.amount;a.paid+=pd;a.bal+=bal;if(b.date>a.last)a.last=b.date;if(bal>0.004)a.items.push({kind:'bill',id:b.id,date:b.date,ref:(b.description||b.category||'Bill')+(b.ref?' · '+b.ref:''),bal,total:b.amount,branchId:b.branchId})}
  for(const a of acc.values()){a.old=r2(a.old);a.bought=r2(a.bought);a.paid=r2(a.paid);a.bal=r2(a.bal);a.items.sort(oldestFirst)}
  return [...acc.values()].sort((x,y)=>y.bal-x.bal||x.name.localeCompare(y.name));
}
function oldestFirst(x,y){return (x.kind==='opening'?0:1)-(y.kind==='opening'?0:1)||String(x.date).localeCompare(String(y.date))}
/* share a payment over the debts, oldest first */
function allocate(items,amount){let left=r2(amount);const out=[];for(const it of items){if(left<=0.004)break;const a=r2(Math.min(left,it.bal));if(a>0){out.push({it,amt:a});left=r2(left-a)}}return {parts:out,left}}

/* full history of one account, in date order, with a running balance */
function accountLedger(kind,key){
  const [b,n]=[key.slice(0,key.indexOf('|')),key.slice(key.indexOf('|')+1)];const mine=x=>x.branchId===b;const rows=[];
  if(kind==='cust'){
    const ops=list('openings').filter(o=>o.type==='receivable'&&mine(o)&&normName(o.party)===n),sales=list('sales').filter(s=>mine(s)&&normName(s.customer)===n);
    const opIds=new Set(ops.map(o=>o.id)),saleIds=new Set(sales.map(s=>s.id));
    ops.forEach(o=>rows.push({date:o.asOf,o:0,desc:'Old balance brought forward (owed before the app)',dr:o.amount,cr:0}));
    sales.forEach(s=>{rows.push({date:s.date,o:1,desc:`Invoice ${s.invoiceNo}: ${(s.items||[]).map(i=>`${num(i.qty)} ${iname(i)}`).join(', ')}`,dr:s.total,cr:0});if(s.paid>0)rows.push({date:s.date,o:2,desc:`Paid at sale (${s.method})`,dr:0,cr:s.paid})});
    list('receipts').filter(r=>(r.saleId&&saleIds.has(r.saleId))||(r.openingId&&opIds.has(r.openingId))).forEach(r=>rows.push({date:r.date,o:3,desc:`Payment received (${r.method}) — for ${r.openingId?'old balance':r.ref}${r.note?' · '+r.note:''}`,dr:0,cr:r.amount}));
  }else{
    const ops=list('openings').filter(o=>o.type==='payable'&&mine(o)&&normName(o.party)===n),purs=list('purchases').filter(p=>mine(p)&&normName(p.supplier)===n),bills=list('payables').filter(p=>mine(p)&&normName(p.supplier)===n);
    const ids=new Set([...ops,...purs,...bills].map(x=>x.id));
    ops.forEach(o=>rows.push({date:o.asOf,o:0,desc:'Old balance brought forward (owed before the app)',dr:o.amount,cr:0}));
    purs.forEach(p=>rows.push({date:p.date,o:1,desc:`Purchase ${p.ref||''}: ${(p.lines||[]).map(l=>`${num(l.qty)} ${pname(l.productId)}`).join(', ')}`,dr:p.total,cr:0}));
    bills.forEach(p=>rows.push({date:p.date,o:1,desc:`Bill: ${p.description||p.category||''}${p.ref?' · '+p.ref:''}`,dr:p.amount,cr:0}));
    list('payments').filter(p=>ids.has(p.purchaseId)||ids.has(p.payableId)||ids.has(p.openingId)).forEach(p=>rows.push({date:p.date,o:3,desc:`Payment made (${p.method})${p.ref?' · '+p.ref:''} — for ${p.openingId?'old balance':p.description||''}`,dr:0,cr:p.amount}));
  }
  rows.sort((x,y)=>String(x.date).localeCompare(String(y.date))||x.o-y.o);let bal=0;rows.forEach(r=>{bal=r2(bal+r.dr-r.cr);r.bal=bal});return rows;
}
function statementHtml(kind,a){
  const rows=accountLedger(kind,a.key),st=settings();const who=kind==='cust'?'Customer':'Supplier';
  return `<p><b>${esc(st.company)}</b> · ${esc(bname(a.branchId))}<br>${who}: <b>${esc(a.name)}</b>${a.phone?' · '+esc(a.phone):''}<br>Statement as at ${fdate(today())}</p>
   <table><thead><tr><th>Date</th><th>Details</th><th class="n">${kind==='cust'?'Owed (+)':'We owe (+)'}</th><th class="n">Paid (−)</th><th class="n">Balance</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td>${fdate(r.date)}</td><td>${esc(r.desc)}</td><td class="n">${r.dr?money(r.dr):''}</td><td class="n">${r.cr?money(r.cr):''}</td><td class="n"><b>${money(r.bal)}</b></td></tr>`).join('')||'<tr><td colspan="5">No transactions.</td></tr>'}</tbody>
   <tfoot><tr><td colspan="2">Old balance (before the app)</td><td class="n">${money(a.old)}</td><td></td><td></td></tr>
   <tr><td colspan="2">${kind==='cust'?'Bought since the app started':'Bought from them since the app started'}</td><td class="n">${money(kind==='cust'?a.sales:a.bought)}</td><td></td><td></td></tr>
   <tr><td colspan="2">Total paid</td><td></td><td class="n">${money(a.paid)}</td><td></td></tr>
   <tr><td colspan="4"><b>${kind==='cust'?'Balance the customer owes':'Balance we owe'}</b></td><td class="n"><b>${money(a.bal)}</b></td></tr></tfoot></table>`;
}
const findAcc=(kind,key)=>(kind==='cust'?custAccounts():supAccounts()).find(a=>a.key===key);
ACT.accStmt=id=>{const [kind,key]=[id.slice(0,4),id.slice(5)];const a=findAcc(kind,key);if(!a)return;

/* one payment for the whole account, shared over old balance and invoices/bills, oldest first */
ACT.accPay=id=>{const [kind,key]=[id.slice(0,4),id.slice(5)];const a=findAcc(kind,key);if(!a||a.bal<=0.004)return toast('Nothing is owed on this account.',true);
  const cust=kind==='cust';
  const m=openModal({title:cust?`Receive payment — ${esc(a.name)}`:`Pay supplier — ${esc(a.name)}`,body:`<form id="apF" class="stack" style="gap:12px">
    <div class="sumbox"><div class="r"><span>${cust?'Customer':'Supplier'}</span><b>${esc(a.name)}</b></div><div class="r"><span>Branch</span><span>${esc(bname(a.branchId))}</span></div>
     ${a.items.map(it=>`<div class="r"><span>${esc(it.ref)} · ${fdate(it.date)}</span><span>${money(it.bal)}</span></div>`).join('')}
     <div class="r big"><span>${cust?'Total the customer owes':'Total we owe'}</span><span>${money(a.bal)}</span></div></div>
    <div class="grid2"><label class="f">${cust?'Amount received':'Amount paid'} (₦)<input class="in" name="amount" type="number" step="0.01" min="0.01" max="${a.bal}" value="${a.bal}" required inputmode="decimal" autofocus></label><label class="f">Date${dateInput('date')}</label></div>
    <div class="grid2"><label class="f">Method<select class="in" name="method">${PAY_METHODS.map(x=>`<option>${x}</option>`).join('')}</select></label><label class="f">Reference / note<input class="in" name="note"></label></div>
    <input type="hidden" name="branchId" value="${esc(a.branchId)}">

    <div data-cashhint></div><div id="apErr" role="alert"></div><button class="btn primary" type="submit">${cust?'Save payment':'Save payment'}</button></form>`});
  const f=m.el.querySelector('#apF');wireCashHint(f,{out:!cust});
  const show=()=>{const v=r2(f.amount.value);const {parts}=allocate(a.items,v>0?v:0);const after=r2(a.bal-sum(parts,'amt'));
    m.el.querySelector('#apAlloc').innerHTML=(parts.map(p=>`<div class="r"><span>${esc(p.it.ref)}</span><span>${money(p.amt)}${p.amt>=p.it.bal-0.004?' <span class="pill ok">cleared</span>':' <span class="pill warn">part</span>'}</span></div>`).join('')||'<div class="r"><span>Enter an amount</span></div>')+`<div class="r big"><span>Balance after this payment</span><span>${money(after)}</span></div>`};
  f.amount.addEventListener('input',show);show();
  f.addEventListener('submit',async e=>{e.preventDefault();const er=errBox(m,'#apErr');const v=r2(f.amount.value);
    if(!(v>0))return er('Enter the amount.');if(v>a.bal+0.004)return er(`That is more than the ${money(a.bal)} owed.`);
    const {parts}=allocate(a.items,v);const grp=uid(),fd=Object.fromEntries(new FormData(f));const btn=f.querySelector('button[type=submit]');btn.disabled=true;
    try{
      for(const p of parts){const it=p.it,note=(fd.note||'')+(parts.length>1?`${fd.note?' · ':''}part of ${money(v)} paid on ${fdate(fd.date)}`:'');
        if(cust)await Store.put('receipts',{date:fd.date,branchId:it.branchId,saleId:it.kind==='sale'?it.id:'',openingId:it.kind==='opening'?it.id:'',customer:a.name,ref:it.kind==='sale'?it.ref.replace('Invoice ',''):'Opening balance',amount:p.amt,method:fd.method,note,groupId:grp,by:S.user.id,createdAt:Date.now()});
        else await Store.put('payments',{kind:'supplier',category:'Supplier payment',branchId:it.branchId,date:fd.date,payee:a.name,description:it.ref,amount:p.amt,method:fd.method,ref:fd.note||'',purchaseId:it.kind==='purchase'?it.id:'',payableId:it.kind==='bill'?it.id:'',openingId:it.kind==='opening'?it.id:'',groupId:grp,by:S.user.id,createdAt:Date.now()});
      }
      await log(cust?'Customer payment':'Supplier payment',`${a.name}: ${money(v)} over ${parts.length} item(s)`);
      closeModal(m);renderApp();
      if(cust){const first=list('receipts').find(x=>x.groupId===grp);const d=openModal({title:'Payment saved',body:`<div class="cam-result"><div class="big">${money(v)}</div><div>received from <b>${esc(a.name)}</b><br>Balance now ${money(r2(a.bal-v))}</div></div>`,
        foot:`<button class="btn" data-cancel>Done</button><button class="btn" data-rp>${ic('print')}Print</button><button class="btn" data-rd>${ic('download')}Download PDF</button><button class="btn primary" data-rs>${ic('send')}Send to customer</button>`});
        d.el.querySelector('[data-rs]').onclick=()=>{if(first){closeModal(d);ACT.sendDoc('rcpt:'+first.id)}};
        d.el.querySelector('[data-rd]').onclick=()=>first&&ACT.rcptDl(first.id);d.el.querySelector('[data-rp]').onclick=()=>first&&ACT.rcptPr(first.id)}
      else toast(`${money(v)} paid to ${a.name}. Balance now ${money(r2(a.bal-v))}`);
    }catch(err){btn.disabled=false}});
};
SPEC.custacc=()=>{

SPEC.supacc=()=>{

/* ----- line-item editor (sales & purchases) ----- */
function lineEditor(el,{bidFn,priceKey,lockPrice,warnStock,initial,onCalc,allowCustom}){
  const box=el.querySelector('[data-lines]');
  const OTHER='__other';
  const isOther=l=>allowCustom&&l&&!l.productId&&l.name;
  const html=l=>`<div class="line"><div class="itemcell"><select class="in" data-k="p" aria-label="Item"><option value="">Select item…</option>${prodOptions(bidFn()||'all',l&&l.productId)}${allowCustom?`<option value="${OTHER}" ${isOther(l)?'selected':''}>＋ Item not on the list…</option>`:''}</select>${allowCustom?`<input class="in" data-k="n" placeholder="Type the item name" aria-label="Name of item not on the list" maxlength="80" value="${isOther(l)?esc(l.name):''}" ${isOther(l)?'':'hidden'}>`:''}</div><input class="in" data-k="q" type="number" min="0" step="any" inputmode="decimal" placeholder="Qty" aria-label="Quantity" value="${l?l.qty:''}"><input class="in" data-k="r" type="number" min="0" step="0.01" inputmode="decimal" placeholder="${priceKey==='price'?'Price':'Unit cost'}" aria-label="${priceKey==='price'?'Unit price':'Unit cost'}" ${lockPrice&&!isOther(l)?'readonly':''} value="${l?(l.price??l.cost):''}"><div class="lt">₦0.00</div><button type="button" class="icon-btn" data-k="x" aria-label="Remove item">×</button></div>`;
  const add=l=>{box.insertAdjacentHTML('beforeend',html(l));calc()};
  const lines=()=>$$('.line',box).map(l=>({l,p:l.querySelector('[data-k=p]').value,n:((l.querySelector('[data-k=n]')||{}).value||'').trim(),q:Number(l.querySelector('[data-k=q]').value)||0,r:Number(l.querySelector('[data-k=r]').value)||0}));
  function calc(){let sub=0;const warn=[];lines().forEach(x=>{const t=r2(x.q*x.r);sub+=t;x.l.querySelector('.lt').textContent=money(t);if(warnStock&&x.p&&x.p!==OTHER&&x.q&&bidFn()){const b=bookQty(bidFn(),x.p)+(warnStock(x.p)||0);if(x.q>b)warn.push(`${pname(x.p)}: only ${num(b)} in stock (book).`)}});onCalc(r2(sub),warn)}
  box.addEventListener('change',e=>{if(e.target.dataset.k==='p'){const ln=e.target.closest('.line'),nm=ln.querySelector('[data-k=n]'),other=e.target.value===OTHER;if(nm){nm.hidden=!other;if(other){ln.querySelector('[data-k=r]').readOnly=false;ln.querySelector('[data-k=r]').value='';calc();nm.focus();return}else{nm.value='';ln.querySelector('[data-k=r]').readOnly=!!lockPrice}}const p=get('products',e.target.value);const r=e.target.closest('.line').querySelector('[data-k=r]');if(p){if(priceKey==='price')r.value=p.price||'';else r.value=costMap().get(p.id)||p.cost||''}e.target.closest('.line').querySelector('[data-k=q]').focus()}calc()});
  box.addEventListener('input',calc);
  box.addEventListener('click',e=>{if(e.target.closest('[data-k=x]')){e.target.closest('.line').remove();if(!$$('.line',box).length)add();calc()}});
  el.querySelector('[data-addline]').onclick=()=>{add();$$('.line select',box).pop().focus()};
  (initial&&initial.length?initial:[null]).forEach(l=>add(l));
  return {lines,calc,reset(){box.innerHTML='';add()}};
}
